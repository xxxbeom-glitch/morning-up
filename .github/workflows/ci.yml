name: CI

on:
  push:
    branches: [ main, 'dev/**' ]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: 빌드, 자동 검사, 단위 테스트
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - name: JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: 빌드 (ktlint, detekt, Lint, 단위 테스트, Robolectric 테스트 포함)
        run: ./gradlew build --stacktrace

      - name: 실패 보고서 올리기
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: reports
          path: |
            **/build/reports/
            **/build/test-results/
          retention-days: 7
