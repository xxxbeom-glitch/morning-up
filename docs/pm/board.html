<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>모닝업 프로젝트 보드</title>
<style>
:root{
  --bg:#FFFFFF; --card:#FFFFFF; --raised:#F1F3F5; --sub:#F8F9FA; --line:#E3E6EA; --divider:#EEF0F2; --hover:#F4F5F7;
  --fg:#14181F; --body:#2C333D; --muted:#525B67; --faint:#626B77; --disabled:#BCC3CC;
  --key:#0B6CF0; --key-soft:#EEF5FF; --key-text:#0A5DD0;
  --sun:#F28A3C; --sun-soft:#FFF1E6; --sun-text:#B35410;
  --ok:#00C281; --ok-soft:#E7F7F0; --ok-text:#00875A;
  --err:#D2353A; --err-soft:#FDECEC; --err-text:#B3242A;
  --hold:#7C8AA5; --hold-soft:#EDF0F6;
  --sky:#0A78C2; --sky-soft:#E6F2FA; --sky-text:#08639F;
  --ask:#7A3FD1; --ask-soft:#F3EDFD; --ask-text:#6A2FC0;
  --shadow:none;
  --panel-shadow:-8px 0 24px rgba(20,24,31,.10);
  --f:"Pretendard","Apple SD Gothic Neo","Malgun Gothic","맑은 고딕",system-ui,sans-serif;
  --mono:ui-monospace,"Cascadia Mono","Consolas",monospace;
  --r1:4px; --r2:6px; --r3:6px;
  color-scheme:light;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0F1115; --card:#15181D; --raised:#1F2329; --sub:#13161A; --line:#262A31; --divider:#1D2026; --hover:#1A1D22;
  --fg:#ECEFF3; --body:#C9CFD7; --muted:#A7B0BB; --faint:#9099A4; --disabled:#4A515B;
  --key:#8AB8FB; --key-soft:#13305A; --key-text:#B9D4FD;
  --sun:#FFB067; --sun-soft:#3A2614; --sun-text:#FFB067;
  --ok:#00E09A; --ok-soft:#123528; --ok-text:#3EF0B5;
  --err:#FF6B6B; --err-soft:#3A1A1C; --err-text:#FF8A8A;
  --hold:#8E9BB3; --hold-soft:#1E2532;
  --sky:#5FB2E3; --sky-soft:#12283A; --sky-text:#8FCBF0;
  --ask:#B794F6; --ask-soft:#2A1F45; --ask-text:#CDB4FA;
  --shadow:none; --panel-shadow:-8px 0 24px rgba(0,0,0,.5); color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0F1115; --card:#15181D; --raised:#1F2329; --sub:#13161A; --line:#262A31; --divider:#1D2026; --hover:#1A1D22;
  --fg:#ECEFF3; --body:#C9CFD7; --muted:#A7B0BB; --faint:#9099A4; --disabled:#4A515B;
  --key:#8AB8FB; --key-soft:#13305A; --key-text:#B9D4FD;
  --sun:#FFB067; --sun-soft:#3A2614; --sun-text:#FFB067;
  --ok:#00E09A; --ok-soft:#123528; --ok-text:#3EF0B5;
  --err:#FF6B6B; --err-soft:#3A1A1C; --err-text:#FF8A8A;
  --hold:#8E9BB3; --hold-soft:#1E2532;
  --sky:#5FB2E3; --sky-soft:#12283A; --sky-text:#8FCBF0;
  --ask:#B794F6; --ask-soft:#2A1F45; --ask-text:#CDB4FA;
  --shadow:none; --panel-shadow:-8px 0 24px rgba(0,0,0,.5); color-scheme:dark}

*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%}
body{background:var(--bg);color:var(--body);font-family:var(--f);font-size:14px;line-height:1.55;word-break:keep-all;-webkit-font-smoothing:antialiased;overflow:hidden}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer}
input{font:inherit;color:inherit}
svg.i{width:16px;height:16px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round;flex:none}
svg.i.s{width:14px;height:14px}
.num{font-variant-numeric:tabular-nums}
.key{font-family:var(--mono);font-size:13px;color:var(--muted);letter-spacing:-.01em;white-space:nowrap}
:focus-visible{outline:2px solid var(--key);outline-offset:2px;border-radius:4px}

/* 틀 */
.app{display:grid;grid-template-rows:auto auto auto 1fr;grid-template-columns:minmax(0,1fr);height:100vh}
.top{display:flex;align-items:center;gap:12px;padding:12px 24px 0}
.top h1{font-size:16px;font-weight:700;color:var(--fg)}
.top .built{color:var(--faint);font-size:13px}
.top .sp{flex:1}
.ibtn{display:inline-flex;align-items:center;justify-content:center;width:28px;height:28px;border-radius:var(--r1);color:var(--muted);transition:background .15s}
.ibtn:hover{background:var(--raised);color:var(--fg)}

/* 요약: 한 줄 글자 */
.stats{display:flex;flex-wrap:wrap;align-items:center;gap:2px 14px;padding:6px 24px 0;font-size:13px;color:var(--muted)}
.stat{display:inline-flex;align-items:baseline;gap:5px;height:24px;padding:0 6px;margin:0 -6px;border-radius:var(--r1);color:var(--muted);white-space:nowrap;line-height:24px}
button.stat:hover{background:var(--hover);color:var(--fg)}
.stat b{font-size:14px;font-weight:600;color:var(--fg);font-variant-numeric:tabular-nums}
.stat.warn b{color:var(--err-text)}
.stat.ask b,.stat.ask{color:var(--ask-text)}
.stat[aria-pressed="true"]{background:var(--key-soft);color:var(--key-text)}
.stat-sep{width:1px;height:12px;background:var(--line)}

/* 탭과 필터 */
.bar{display:flex;align-items:center;gap:4px;flex-wrap:wrap;padding:10px 24px 8px;border-bottom:1px solid var(--line)}
.tabs{display:flex;gap:2px;margin-right:12px}
.tab{display:inline-flex;align-items:center;gap:6px;height:28px;padding:0 10px;border-radius:var(--r1);color:var(--muted);font-weight:500;transition:background .15s,color .15s}
.tab:hover{background:var(--hover);color:var(--fg)}
.tab[aria-selected="true"]{background:var(--raised);color:var(--fg);font-weight:600}
.tab .n{font-size:12px;color:var(--faint);font-weight:500}
.search{display:flex;align-items:center;gap:6px;height:28px;padding:0 8px;border-radius:var(--r1);background:var(--bg);border:1px solid var(--line);color:var(--faint);min-width:200px;margin-right:4px}
.search input{border:0;outline:0;background:none;width:100%;color:var(--fg)}
.search:focus-within{border-color:var(--key)}
.fbtn{display:inline-flex;align-items:center;gap:4px;height:28px;padding:0 8px;border-radius:var(--r1);color:var(--muted);transition:background .15s}
.fbtn:hover{background:var(--hover);color:var(--fg)}
.fbtn .dn{color:var(--faint)}
.fbtn.on{background:var(--key-soft);color:var(--key-text);font-weight:600}
.fbtn .x{display:inline-flex;margin-right:-4px;border-radius:4px;padding:2px}
.fbtn .x:hover{background:rgba(11,108,240,.15)}
.reset{height:28px;padding:0 8px;color:var(--key-text);font-weight:600;border-radius:var(--r1)}
.reset:hover{background:var(--key-soft)}
.count{margin-left:auto;color:var(--faint);font-size:13px}
.menu{position:fixed;z-index:40;min-width:220px;max-height:60vh;overflow:auto;padding:6px;background:var(--card);border:1px solid var(--line);border-radius:var(--r2);box-shadow:0 8px 24px rgba(20,24,31,.12)}
.menu label{display:flex;align-items:center;gap:8px;padding:6px 8px;border-radius:var(--r1);cursor:pointer;white-space:nowrap}
.menu label:hover{background:var(--hover)}
.menu input{accent-color:var(--key);width:15px;height:15px}
.menu .c{margin-left:auto;color:var(--faint);font-size:13px;padding-left:16px}
.menu .hd{padding:6px 8px 4px;font-size:12px;font-weight:600;color:var(--faint)}

/* 본문 */
.main{overflow:auto;position:relative}
.view{padding:16px 24px 40px}
.empty{padding:60px 0;text-align:center;color:var(--faint)}

/* 칩 */
.chip{display:inline-flex;align-items:center;gap:6px;font-size:13px;font-weight:500;color:var(--body);white-space:nowrap}
.chip::before{content:"";width:7px;height:7px;border-radius:50%;background:var(--c,currentColor);flex:none}
.chip.plain::before{display:none}
.s-todo{--c:var(--disabled)}
.s-doing{--c:var(--key)}
.s-review{--c:var(--sun)}
.s-waiting_user{--c:var(--ask)}
.chip.s-waiting_user{color:var(--ask-text);font-weight:600}
.s-done{--c:var(--ok)}
.s-hold{--c:var(--hold)}
.s-cancelled{--c:var(--disabled)}
.chip.s-cancelled,.chip.s-closed{color:var(--faint)}
.s-open{--c:var(--err)}
.s-reopened{--c:var(--err)}
.chip.s-reopened{color:var(--err-text);font-weight:600}
.s-resolved{--c:var(--ok)}
.s-closed{--c:var(--disabled)}
.sev{display:inline-flex;align-items:center;gap:4px;font-size:13px;font-weight:600;white-space:nowrap}
.sev-high{color:var(--err-text)} .sev-medium{color:var(--sun-text)} .sev-low{color:var(--faint)}
.area{display:inline-flex;align-items:center;height:18px;padding:0 5px;border-radius:var(--r1);background:var(--raised);color:var(--muted);font-size:12px;font-weight:500;white-space:nowrap}
.who{display:inline-flex;align-items:center;gap:4px;color:var(--muted);font-size:13px;white-space:nowrap}
.av{display:inline-flex;align-items:center;justify-content:center;width:18px;height:18px;border-radius:50%;background:var(--raised);color:var(--muted);font-size:12px;font-weight:700}
.av.me{background:var(--key-soft);color:var(--key-text)}
.lnk{color:var(--key-text);cursor:pointer}
.lnk:hover{text-decoration:underline}
.clickable{cursor:pointer}
.clickable:hover{filter:brightness(.96)}

/* 칸반 */
.kb{display:grid;grid-auto-flow:column;grid-auto-columns:minmax(260px,1fr);gap:12px;align-items:start;min-width:max-content}
.col{background:var(--sub);border-radius:var(--r2);padding:6px;min-width:260px}
.col.fold .cards{display:none}
.col[data-st="waiting_user"]{background:var(--ask-soft)}
.colh{display:flex;align-items:center;gap:8px;padding:4px 6px 8px;font-weight:600;color:var(--fg)}
.colh button.t{display:flex;align-items:center;gap:8px;border-radius:var(--r1);padding:2px 4px;margin:-2px -4px}
.colh button.t:hover{background:var(--hover)}
.colh .n{color:var(--faint);font-weight:500;font-variant-numeric:tabular-nums}
.colh .fold{margin-left:auto}
.cards{display:flex;flex-direction:column;gap:6px}
.card{display:block;width:100%;text-align:left;background:var(--card);border:1px solid var(--line);border-radius:var(--r2);padding:9px 11px;transition:border-color .15s}
.card:hover{border-color:var(--disabled)}
.card[aria-current="true"]{box-shadow:inset 0 0 0 2px var(--key)}
.card .r1{display:flex;align-items:center;gap:6px;margin-bottom:4px}
.card .r1 .sp{flex:1}
.card .tt{color:var(--fg);font-weight:500;line-height:1.45}
.card .r3{display:flex;align-items:center;gap:10px;margin-top:8px;color:var(--faint);font-size:13px}
.card .r3 .sp{flex:1}
.meta{display:inline-flex;align-items:center;gap:3px}
.late{color:var(--err-text);font-weight:600}
.more{width:100%;padding:8px;color:var(--muted);font-weight:600;border-radius:var(--r1)}
.more:hover{background:var(--hover)}

/* 표 */
table{border-collapse:separate;border-spacing:0;width:100%}
.tbl{border:1px solid var(--line);border-radius:var(--r2);overflow:hidden}
.tbl th{position:sticky;top:0;z-index:2;background:var(--bg);text-align:left;font-size:13px;font-weight:600;color:var(--faint);padding:10px 12px;border-bottom:1px solid var(--line);white-space:nowrap}
.tbl th button{display:inline-flex;align-items:center;gap:4px;font-weight:600;color:inherit}
.tbl th button:hover{color:var(--fg)}
.tbl th[aria-sort] button{color:var(--fg)}
.tbl td{padding:9px 12px;border-bottom:1px solid var(--divider);vertical-align:middle}
.tbl tr:last-child td{border-bottom:0}
.tbl tbody tr{cursor:pointer;transition:background .12s}
.tbl tbody tr:hover{background:var(--hover)}
.tbl tbody tr[aria-current="true"]{background:var(--key-soft)}
.tbl td.tt{color:var(--fg);font-weight:500;min-width:240px}
.tbl tr.grp td{background:var(--sub);font-weight:700;color:var(--fg);cursor:default;padding:8px 12px}
.tbl tr.again td:first-child{box-shadow:inset 3px 0 0 var(--err)}
.again-n{display:inline-flex;align-items:center;gap:3px;color:var(--err-text);font-weight:700}

/* 간트 */
.gt{position:relative;background:var(--bg);border:1px solid var(--line);border-radius:var(--r2);overflow:auto;max-height:calc(100vh - 260px)}
.gt .grid{display:grid;grid-template-columns:340px auto;min-width:max-content}
.gt .lh,.gt .dh{position:sticky;top:0;z-index:3;background:var(--bg);border-bottom:1px solid var(--line);height:48px}
.gt .lh{left:0;z-index:4;display:flex;align-items:flex-end;padding:0 12px 8px;font-size:13px;font-weight:600;color:var(--faint)}
.gt .dh{display:flex}
.gt .day{width:var(--dw);flex:none;display:flex;flex-direction:column;align-items:center;justify-content:flex-end;padding-bottom:6px;font-size:12px;color:var(--faint);border-left:1px solid transparent}
.gt .day.mon{border-left-color:var(--line)}
.gt .day.we{color:var(--disabled)}
.gt .day.td{color:var(--sun-text);font-weight:700}
.gt .day .m{font-size:12px;font-weight:600;color:var(--muted);height:16px}
.gt .lab{position:sticky;left:0;z-index:2;background:var(--bg);display:flex;align-items:center;gap:8px;height:32px;padding:0 12px;border-right:1px solid var(--line);border-bottom:1px solid var(--divider);overflow:hidden;white-space:nowrap;cursor:pointer}
.gt .lab:hover{background:var(--hover)}
.gt .lab .tt{overflow:hidden;text-overflow:ellipsis;color:var(--body)}
.gt .lab.g{font-weight:600;color:var(--fg);background:var(--sub)}
.gt .lab.g .tt{color:var(--fg)}
.gt .lane{position:relative;height:32px;border-bottom:1px solid var(--divider)}
.gt .lane.g{background:var(--sub)}
.gt .bar{position:absolute;top:8px;height:16px;border-radius:4px;cursor:pointer;transition:filter .12s}
.gt .bar:hover{filter:brightness(1.08)}
.gt .bar.g{top:13px;height:6px;border-radius:3px;background:var(--disabled);cursor:default}
.gt .ms{position:absolute;top:8px;width:16px;height:16px;transform:translateX(-8px) rotate(45deg) scale(.8);border-radius:3px;background:var(--sun);cursor:pointer}
.gt .bl{position:absolute;top:0;bottom:0;pointer-events:none}
.gt .bl.today{width:2px;background:var(--sun);opacity:.9;z-index:1}
.gt .bl.msl{width:0;border-left:1px dashed var(--sun);opacity:.6}
.gt .bl.we{background:var(--sub);opacity:.8}
.b-todo{background:var(--disabled)} .b-doing{background:var(--key)} .b-review{background:var(--sun)}
.b-waiting_user{background:var(--ask)} .b-done{background:var(--ok)} .b-hold{background:var(--hold);opacity:.5} .b-cancelled{background:var(--disabled);opacity:.4}
.legend{display:flex;gap:14px;flex-wrap:wrap;margin:0 0 10px;color:var(--muted);font-size:13px}
.legend i{display:inline-block;width:10px;height:10px;border-radius:3px;margin-right:5px;vertical-align:-1px}
.nodate{margin-top:14px;color:var(--muted)}
.nodate .lnk{margin-right:10px}

/* 활동 */
.feed{border:1px solid var(--line);border-radius:var(--r2);padding:4px 0}
.ev{display:grid;grid-template-columns:130px 96px 1fr;gap:12px;padding:8px 16px;border-bottom:1px solid var(--divider);align-items:baseline}
.ev:last-child{border-bottom:0}
.ev .at{color:var(--faint);font-size:13px}
.ev .by{color:var(--muted);font-weight:600;font-size:13px}

/* 상세 패널 */
.scrim{position:fixed;inset:0;background:rgba(11,15,22,.2);opacity:0;pointer-events:none;transition:opacity .2s;z-index:20}
.panel{position:fixed;top:0;right:0;bottom:0;width:min(560px,100vw);background:var(--card);box-shadow:var(--panel-shadow);transform:translateX(102%);transition:transform .22s cubic-bezier(.2,.8,.2,1);z-index:30;display:flex;flex-direction:column}
body.open .panel{transform:none}
body.open .scrim{opacity:1;pointer-events:auto}
.ph{display:flex;align-items:center;gap:8px;padding:14px 16px 0 24px}
.ph .sp{flex:1}
.pb{overflow:auto;padding:8px 24px 40px}
.pb h2{font-size:16px;line-height:1.4;color:var(--fg);font-weight:600;margin:6px 0 14px}
.props{display:grid;grid-template-columns:96px 1fr;gap:2px 12px;margin-bottom:18px}
.props dt{color:var(--faint);font-size:13px;padding:6px 0}
.props dd{padding:4px 0;min-height:30px;display:flex;align-items:center;gap:6px;flex-wrap:wrap;color:var(--body)}
.sec{border-top:1px solid var(--divider);padding:16px 0 4px}
.sec h3{display:flex;align-items:center;gap:6px;font-size:13px;font-weight:700;color:var(--muted);margin-bottom:10px}
.sec h3 .n{color:var(--faint);font-weight:500}
.prose{white-space:pre-wrap;color:var(--body)}
.blank{color:var(--faint)}
.acc{list-style:none;counter-reset:a}
.acc li{counter-increment:a;display:flex;gap:8px;padding:3px 0}
.acc li::before{content:counter(a);flex:none;width:18px;height:18px;border-radius:50%;background:var(--raised);color:var(--muted);font-size:12px;font-weight:700;display:flex;align-items:center;justify-content:center;margin-top:1px}
.chk{list-style:none}
.chk li{display:flex;gap:8px;padding:3px 0;align-items:flex-start}
.chk .bx{flex:none;width:16px;height:16px;border-radius:4px;border:1.5px solid var(--disabled);margin-top:2px;display:flex;align-items:center;justify-content:center}
.chk li.d .bx{background:var(--ok);border-color:var(--ok);color:#fff}
.chk li.d span{color:var(--faint);text-decoration:line-through}
.prog{height:4px;border-radius:2px;background:var(--raised);overflow:hidden;margin:-2px 0 10px}
.prog i{display:block;height:100%;background:var(--ok)}
.rel{display:flex;flex-direction:column;gap:2px}
.rel .h{font-size:12px;color:var(--faint);margin:6px 0 2px}
.rel button{display:flex;align-items:center;gap:8px;text-align:left;padding:5px 8px;margin:0 -8px;border-radius:var(--r1)}
.rel button:hover{background:var(--hover)}
.rel button .tt{color:var(--body);overflow:hidden;text-overflow:ellipsis;white-space:nowrap;flex:1}
.refs a,.refs span{display:block;font-family:var(--mono);font-size:13px;color:var(--muted);padding:2px 0}
.cm{display:flex;gap:10px;padding:6px 0}
.cm .body{flex:1}
.cm .hd{font-size:13px;color:var(--faint)}
.cm .hd b{color:var(--fg);font-weight:600;margin-right:6px}
.cm .tx{white-space:pre-wrap}
.cm.rej .tx{color:var(--err-text)}
.act{list-style:none;border-left:2px solid var(--divider);margin-left:6px;padding-left:14px}
.act li{position:relative;padding:4px 0;font-size:13px;color:var(--muted)}
.act li::before{content:"";position:absolute;left:-19px;top:10px;width:8px;height:8px;border-radius:50%;background:var(--disabled)}
.act b{color:var(--body);font-weight:600}
.act .at{color:var(--faint);margin-right:6px}
.cmd{display:flex;align-items:center;gap:8px;margin-top:6px;padding:8px 10px;border-radius:var(--r1);background:var(--raised);font-family:var(--mono);font-size:13px;color:var(--muted)}
.cmd code{flex:1;overflow:auto;white-space:nowrap}
.copy{display:inline-flex;align-items:center;gap:4px;font-family:var(--f);font-weight:600;color:var(--key-text);padding:2px 6px;border-radius:5px}
.copy:hover{background:var(--key-soft)}

/* 목록 보기 (11-23 시안 구성, 11-23 TSK-160 업무 도구 톤) */
[hidden]{display:none!important}
.lv{display:grid;grid-template-columns:minmax(0,1fr) 300px;gap:32px;align-items:start;max-width:1320px}
.lv-left{display:flex;flex-direction:column;gap:10px;min-width:0}
.lv-chips{display:flex;flex-wrap:wrap;gap:2px;margin-left:-2px}
.lv-chip{height:28px;padding:0 10px;border-radius:var(--r1);color:var(--muted);font-weight:500;transition:background .15s,color .15s}
.lv-chip:hover{background:var(--hover);color:var(--fg)}
.lv-chip[aria-pressed="true"]{background:var(--raised);color:var(--fg);font-weight:600}
.lv-chip .n{font-size:12px;font-weight:500;color:var(--faint);margin-left:5px}
.lv{--lvcols:8px 72px minmax(0,1fr) 64px 48px 84px}
.lv-head{display:grid;grid-template-columns:var(--lvcols);gap:10px;align-items:center;height:28px;padding:0 12px;border-top:1px solid var(--line);font-size:12px;font-weight:600;color:var(--faint)}
.lv-groups{border:1px solid var(--line);border-radius:var(--r2);overflow:hidden}
.lv-grp+.lv-grp{border-top:1px solid var(--line)}
.lv-grp>summary{list-style:none;display:flex;align-items:center;gap:8px;height:40px;padding:0 12px;background:var(--sub);cursor:pointer;user-select:none;transition:background .15s}
.lv-grp>summary::-webkit-details-marker{display:none}
.lv-grp>summary:hover{background:var(--hover)}

.lv-dot{width:8px;height:8px;border-radius:50%}

.lv-ttl svg{color:var(--sun-text)}
.lv-own{color:var(--muted);font-size:13px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.lv-due{color:var(--muted);font-family:var(--mono);font-size:13px}
.lv-row.urgent .lv-due{color:var(--err-text);font-weight:600}
.lv-row[data-st="done"] .lv-ttl{color:var(--muted)}
.lv-row[data-st="cancelled"] .lv-ttl{color:var(--faint);text-decoration:line-through}
.lv-row:is([data-st="done"],[data-st="hold"],[data-st="cancelled"]):not(.open) .lv-main{opacity:.55}
.lv-row:is([data-st="done"],[data-st="hold"],[data-st="cancelled"]):not(.open) .lv-main:hover{opacity:.85}
.lv-row.open{background:var(--sub)}
.lv-row.open .lv-ttl{font-weight:600}

.lv-det{padding:4px 12px 20px 102px;display:flex;flex-direction:column;gap:18px}
.lv-desc{white-space:pre-wrap;max-width:72ch;line-height:1.65;color:var(--body)}
.lv-desc.blank{color:var(--faint)}
.lv-blk+.lv-blk{padding-top:16px;border-top:1px solid var(--divider)}
.lv-blk h4{font-size:12px;font-weight:600;color:var(--faint);margin-bottom:6px;display:flex;gap:6px;align-items:center}
.lv-cnt{font-family:var(--mono);font-size:12px;font-weight:500;color:var(--ok-text)}

.lv-acc li::before{content:"";position:absolute;left:3px;top:.65em;width:4px;height:4px;border-radius:50%;background:var(--muted)}
.lv-chk li{display:flex;gap:8px;align-items:flex-start;color:var(--body)}
.lv-box{flex:none;width:14px;height:14px;border:1.5px solid var(--disabled);border-radius:3px;margin-top:2px;display:flex;align-items:center;justify-content:center;color:#fff}
.lv-box svg{width:10px;height:10px;stroke-width:3}
.lv-chk li.on{color:var(--faint);text-decoration:line-through}
.lv-chk li.on .lv-box{background:var(--ok);border-color:var(--ok)}
.lv-info{display:grid;grid-template-columns:84px minmax(0,1fr);gap:4px 12px;max-width:760px}
.lv-info dt{color:var(--faint);font-size:13px;padding-top:1px}
.lv-info dd{min-width:0;overflow-wrap:anywhere;color:var(--body)}
.lv-info code{font-family:var(--mono);font-size:12px;background:var(--raised);padding:1px 5px;border-radius:3px;margin-right:4px}

.lv-cmt li{line-height:1.6;white-space:pre-wrap;color:var(--body);max-width:72ch}

 데 씀(결정 73). 신고 초안에 사용 이유 추가 필요"}, {"at": "2026-11-24 10:48:09", "by": "[기획 5]", "text": "ISS-038 결과 반영: '다른 앱 위에 표시'(SYSTEM_ALERT_WINDOW)는 쓰는 권한(결정 73, RingNotifications.openScreenNow). 사용 이유 '알람 울림 화면을 다른 앱 위로 띄우기 위해'를 play-declarations-draft.md 6절(영어 답 포함), data-safety-answers.md 3절, 개인정보처리방침 7절 권한 표(md, html 다시 만듦)에 넣음. '빼는 게 안전' 메모는 지움"}], "milestone": false}, {"id": "TSK-085", "wbs": "2.33", "parent": "TSK-002", "title": "개인정보처리방침 공개 페이지 올리기", "area": "plan", "owner": "[기획 5]", "reviewer": "Leader", "verify": null, "status": "done", "start": "2026-11-23", "due": "2026-11-24", "deps": ["TSK-018"], "relates": [], "decisions": [], "commits": [], "refs": ["docs/privacy-policy-draft.md", "docs/release/privacy-policy.html"], "screens": [], "figma": [], "desc": "앱 전용 한 장 사이트(GitHub Pages)와 같이", "acceptance": [], "checklist": [], "comments": [{"at": "2026-11-23 16:15:09", "by": "[기획 5]", "text": "올리지 않고 초안만(Leader 지시). docs/privacy-policy-draft.md를 코드와 매니페스트에 맞춰 다시 씀(잠들기 재생 뺌, 위치 0.05도 반올림과 30분, 6시간, IP 노출, 사진, 흔들기 센서, 진단 기록 2000줄, 의견 보내기 메일, 구글 자동 백업, 권한 표 10줄, 접근성). 공개용 docs/release/privacy-policy.html 생성(빈칸 강조, noindex). 빈칸: 앱 이름, 운영 국가, 메일 보관 기간, 상호, 책임자, 연락처, 시행일. 올릴 곳은 사용자 결정 남음"}, {"at": "2026-11-23 16:26:02", "by": "Leader", "text": "초안 승인. 넣을 정보(상호, 책임자, 메일, 시행일)와 올릴 곳은 사용자 답을 받은 뒤 올림"}, {"at": "2026-11-24 10:32:19", "by": "Leader", "text": "11-24 사용자 승인: 상호, 책임자 이름, 대표 메일만 넣음(저장소에는 자리표시). 앱 전용 사이트에 올림(사이트 생기면). 의견 메일 답장 뒤 1년 보관. 이용 연령 13세 이상. Open-Meteo는 공유 없음"}, {"at": "2026-11-24 10:33:08", "by": "[기획 5]", "text": "11-24 사용자 답 반영. 문의는 {상호} {책임자} {메일} 자리표시(실제 값은 올릴 때), 주소 전화 사업자번호 뺌. 의견 메일 답장 뒤 1년, 이용 연령 만 13세 이상(만 14세 미만은 위치, 메일 전 보호자 동의 한 줄), Open-Meteo 받는 곳 스위스. 남은 빈칸은 [앱 이름] [날짜]. html 다시 만듦(올리지 않음, 앱 전용 사이트 생기면). data-safety-answers.md에 공유 없음, 13세 이상, 올릴 곳 반영"}, {"at": "2026-11-24 10:33:32", "by": "Leader", "text": "자리표시 3개, 개인정보 없음, 1년 보관과 13세 반영 확인. 사이트가 생기면 값 채워 올림"}], "milestone": false}, {"id": "TSK-092", "wbs": "2.34", "parent": "TSK-002", "title 그 안에 확인 안 하면 다시 울림"}, {"at": "2026-11-23 15:06:59", "by": "Leader", "text": "11-23 사용자 추가: 1차 '깼어요' 뒤 알림 창에 'N분 뒤 한 번 더 물어봐요' 안내, 정말 일어났으면 눌러서 완전 해제. Leader 의견: 알림 버튼 한 번으로 끝내지 말고 확인 화면(밀기 또는 길게 누르기)을 열게"}, {"at": "2026-11-23 15:08:21", "by": "Leader", "text": "11-23 사용자 확정: 1) 1차 '깼어요' 뒤 알림 안내, 누르면 확인 화면(밀기 또는 길게 누르기)으로 완전 해제 2) '정말 깼어요?' 확인은 알람마다가 아니라 앱 전체 설정에서 일괄 적용. 알람별 S4와 나누는 안은 [기획 5] 추천"}, {"at": "2026-11-23 15:08:25", "by": "[기획 5]", "text": "결정 145(추천, 사용자 확인 전)를 docs/decisions-11-23.md에 적음: 1) 놓치면 2차 다시 묻기 30초(벨소리 60→100%), 1차에 짧은 알림음 추가(지금 무음) 2) W2로 처음부터 다시 울리는 바퀴는 알람 하나에 2번까지 3) 토글 끔, 삭제, 저장, 다른 알람이 울리면 남은 확인 취소. 문구, 136/83/ADR과 어긋나는 곳 표, 그 밖의 상황 9개 표(출시 전/뒤), 디자인 몫(W2 다시 묻기 두 장), 개발 몫 적음"}, {"at": "2026-11-23 15:13:00", "by": "[기획 5]", "text": "결정 145를 사용자 방향(11-23 세 메시지)대로 다시 씀. 확정 2개(알림 안내 후 W3에서 동작해야 해제, 전체 설정 일괄) 표시. 추천: 10초 길게 누르기 하나, 확인할 시간 3/5/10분 처음 10분, 2차 크게 묻기는 뺌, 바퀴 상한 2, 취소 조건, 알람마다 토글만 남기고 간격과 시간은 전체 설정(T1 새 카드), 몇 번 물을까요 없앰(TSK-086 대체 추천). 사용자 확인: W2 무음에 짧은 알림음 넣을지"}, {"at": "2026-11-23 15:14:52", "by": "[기획 5]", "text": "Leader 확정(사용자 위임 11-23)으로 결정 145 마무리: '추천, 사용자 확인 전' 표시를 바꿈, W2 짧은 알림음 확정, 디자인 몫을 화면별 8묶음으로 자세히(W3 네 장과 Hold Button, W2 깼어요 누름, W2-1 알림, H0 띠, T1 카드, T1-1과 T1-2 시트, S0 줄, S4 처리). 이미 검토 요망 상태라 다시 submit하지 않고 댓글로 남김"}, {"at": "2026-11-23 15:16:14", "by": "Leader", "text": "결정 145 확인. 사용자 확정 2개, 나머지 Leader 확정(위임). 개발 전 사용자 요약 확인"}], "milestone": false}, {"id": "TSK-170", "wbs": "2.41", "parent": "TSK-002", "title": "'확실히 잠깨기' 실험실 기획 (버튼 속이기, 여러 번 묻기 규칙)", "area": "plan", "owner": "[기획 5]", "reviewer": "Leader", "verify": null, "status": "done", "start": "2026-11-24", "due": "2026-11-24", "deps": [], "relates": [], "decisions": ["146"], "commits": [], "refs": ["research/I-monetization-hardcore.md", "docs/decisions-11-24.md"], "screens": [], "figma": [], "desc": null, "acceptance": [], "checklist": [], "comments": [{"at": "2026-11-24 11:20:39", "by": "[기획 5]", "text": "docs/decisions-11-24.md '결정 146 자세히'. 실험실은 T1 맨 아래 카드 → o", "start": "2026-12-01", "due": "2026-12-05", "deps": [], "relates": [], "decisions": [], "commits": [], "refs": [], "screens": [], "figma": [], "desc": null, "acceptance": [], "checklist": [], "comments": [], "milestone": false}, {"id": "TSK-158", "wbs": "3.25", "parent": "TSK-003", "title": "피그마 화면 프레임 이름을 naming.md 규칙으로 바꾸기", "area": "design", "owner": "[디자인 13]", "reviewer": "Leader", "verify": null, "status": "done", "start": "2026-11-23", "due": "2026-11-23", "deps": [], "relates": [], "decisions": ["144"], "commits": [], "refs": ["docs/pm/naming.md"], "screens": [], "figma": [], "desc": "naming.md 7장 대응표대로 피그마 화면 페이지 프레임과 구역 이름만 바꿈. 위치, 구역 배치, 보관 이동은 하지 않음.", "acceptance": [], "checklist": [], "comments": [{"at": "2026-11-23 13:52:55", "by": "[디자인 13]", "text": "피그마 화면 페이지 이름 바꿈 끝: 구역 2개 + 프레임 124장 = 126개(노드 id로 찾고, 지금 이름이 대응표와 같을 때만 바꿈). 대응표와 다른 점 없음(없는 노드 0, 이름 다른 것 0), 이미 맞던 11장은 그대로. 위치, 크기, 내용, 부품은 손대지 않음. 대응표에 없고 규칙에 안 맞는 것: 페이지 바로 아래 App Icon / Type2(989:21609), Frame 1(1028:21912), Frame 2(1031:12699), Status bar - iPhone 1(1037:12722)와 낱개 레이어 image 1, image 2, Vector 1, Mokker, Status bar - iPhone(인스턴스). 앱 아이콘 (ICN) 구역 안 App Icon / Clock Day(921:12691), App Icon / Clock Day Black(991:12699)은 ICN 코드 없음. 11-18 권한 시트와 배너 구역은 규칙대로 그대로. design-system.md 화면 코드 표와 T2 줄을 새 이름으로 맞추고 11-23 안내 한 줄, naming.md 바뀐 기록 한 줄. 커밋 안 함."}, {"at": "2026-11-23 13:52:55", "by": "[디자인 13]", "text": "대응표대로 126개 이름 바꿈, 다른 점 없음"}, {"at": "2026-11-23 13:53:21", "by": "Leader", "text": "대응표 126개 다 바꿈, 위치 그대로 확인. 규칙 밖 이름(App Icon 등 9개)은 다음에 사용자 지시 있을 때만"}], "milestone": false}, {"id": "TSK-159", "wbs": "3.26", "parent": "TSK-003", "title": "일정판에 목록 보기(아코디언, 오른쪽 진행률 패널) 넣기", "area": "design", "owner": "[디자인 14]", "reviewer": "Leader", "verify": "agent", "status": "done", "start": "2026-11-23", "due": "2026-11-23", "deps": [], "relates": [], "decisions": [], "commits": [], "refs": ["tools/pm/board_template.html", "docs/exports/board-preview.html"], "screens": [], "figma": [], "desc": "11-23 사용자 확인한 시안(아티팩트 HvZude4yYyvS5QTVXkcUhV)을 tools/pm/board_template.html에 옮김. 칸반은 그대로 두고 칸반/목록 전환. 일 데이터는 건드리지 않음. 커밋 안 함", "acceptance": ["보드를 다시 만들면(pm.py build) 목록 보기가 시안처럼 보임: 왼쪽 묶음 아코디언, 오른쪽 진행률(전체 %와 묶음별 막대), 내 확인 차례, 급한 일, 열린 이슈, 최근 소식", "일 줄을 누르면 그 자리에서 설명, 완료 조건, 체크리스트, 정보, 메모가 펼쳐지고 다시 누르면 접힘", "칸반 보기는 그대로 있고 위쪽 버튼으로 오감", "좁은 화면에서 오른쪽 패널이 위로 올라가고, 다크 모드에서도 읽힘", "tasks.jsonl, issues.jsonl, events.jsonl 내용은 바뀌지 않음", "상태 이름이 화면 전체에서 대기, 진행 중, 검토 요망, 확인 요망, 완료, 보류, 취소로 보임(키와 데이터는 그대로)"], "checklist": [], "comments": [{"at": "2026-11-23 14:38:56", "by": "[디자인 14]", "text": "board_template.html에 목록 보기 추가(첫 탭, 처음 열면 목록). 탭: 목록/칸반/표(옛 목록 표)/간트/이슈/기록. 왼쪽 묶음 아코디언+상태 칩, 줄 누르면 그 자리 펼침(설명, 완료 조건, 체크리스트, 정보, 메모 최근 3개, 상세 패널 열기), 오른쪽 진행률/내 확인 차례/급한 일/열린 이슈/최근 소식(기록 마지막 6개), 오른쪽 항목 누르면 그 일로 이동해 펼침. [hidden]{display:none!important} 넣음. 색은 보드 토큰과 보드 상태 색. 상태 이름은 pm.py KO_TASK를 대기/진행 중/검토 요망/확인 요망/완료/보류/취소로(화면 전체). 좁은 화면 가로 넘침(앱 전체 589px) 고침: .app 열 minmax(0,1fr). 캡처 docs/exports/board-list/. jsonl은 claim, submit 외 안 바꿈. 커밋 안 함"}, {"at": "2026-11-23 14:39:34", "by": "[디자인 14]", "text": "상태 이름 추가 반영: pm.py KO_TASK, 보드 요약 칸/목록 상태 칩(L.task 사용), pm.py approve 안내 문구 '확인 요망(waiting_user)', README status 줄에 화면 이름 대응 한 줄. qa-guide에는 옛 이름 없음. 화면 옛 이름 0개 확인"}, {"at": "2026-11-23 14:40:45", "by": "Leader", "text": "후속(사용자 11-23 '바꿔 줘'): 확인 요망 색을 진행 중 파랑과 겹치지 않게(추천 보라) [디자인 14]에 요청"}, {"at": "2026-11-23 14:41:29", "by": "[디자인 14]", "text": "후속(11-23 사용자 '바꿔 줘'): 확인 요망 색을 보라로. 새 토큰 --ask(라이트 #7A3FD1/#F3EDFD/#6A2FC0, 다크 #B794F6/#2A1F45/#CDB4FA). 바꾼 곳: 상태 칩, 줄 앞 점, 진행률 막대와 범례, 내 확인 차례 왼쪽 띠와 개수 배지, 위쪽 '사용자 확인 요망' 칸(숫자 보라+왼쪽 띠, 0개면 보통), 칸반 확인 요망 열 바탕. 글자 대비 라이트 칩 6.6:1, 다크 칩 8.3:1. 캡처 docs/exports/board-list/wide-light-ask-purple.png, wide-dark-ask-purple.png, wide-light-ask-purple-kanban.png. 데이터, 커밋 안 건드림"}], "milestone": false}, {"id": "TSK-160", "wbs": "3.27", "parent": "TSK-003", "title": "일정판 화면을 깔끔한 업무 도구 느낌으로 다듬기", "area": "design", "owner": "[디자인 14]", "reviewer": "Leader", "verify": "user", "status": "done", "start": "2026-11-23", "due": "2026-11-23", "deps": [], "relates": [], "decisions": [], "commits": [], "refs": ["tools/pm/board_template.html"], "screens": [], "figma": [], "desc": "11-23 사용자: AI가 만든 티 나는 뻔한 디자인 말고 깔끔한 툴처럼. 구성과 동작(TSK-159), 상태 이름과 색 구분은 유지하고 겉모습만 다듬음. 데이터와 커밋은 건드리지 않음", "acceptance": [], "checklist": [], "comments": [{"at": "2026-11-23 14:42:56", "by": "Leader", "text": "추가(사용자 11-23): 글자 전체 한 단계 키우기(최소 12), 흐린 글자 대비 올리기, 목록 칸 정렬과 머리줄, 상세와 오른쪽 패널 소제목과 구분선, 끝남/보류/취소 줄 흐리게"}, {"at": "2026-11-23 14:47:56", "by": "[디자인 14]", "text": "업무 도구 톤으로 다듬음: 큰 숫자 카드 8개를 한 줄 요약으로, 카드와 그림자를 1px 구분선과 여백으로, 왼쪽 색 띠 뺌, 상태 알약을 점+글자로, 점선 필터 버튼을 글자+화살표로, 42% 거대 숫자를 17px 한 줄로. 바탕 무채색, 강조는 키 블루 하나, 모서리 4~6. 글자 한 단계 키움(본문 13→14, 보조 12→13), 줄 높이 40. 구성, 동작, 상태 색(보라 포함), 다크 유지. 캡처 docs/exports/board-list/*-clean.png. impeccable detect: 보류 빗금 하나만 알림(데이터 표시라 유지)."}, {"at": "2026-11-23 14:49:20", "by": "[디자인 14]", "text": "추가 반영(11-23 Leader 전달): 12px 아래 글자 없앰, 흐린 글자 대비 올림, 목록 묶음 아래 칸 이름 머리줄(번호, 제목, 담당, 마감, 상태)과 칸 너비 통일, 상세를 설명, 완료 조건, 체크리스트, 정보, 메모 소제목과 구분선으로 나눔, 오른쪽 패널 소제목 키움, 완료, 보류, 취소 줄 흐리게. 담당은 화면에서 분야 이름만(방 번호, '대기 중', 동그라미 라벨 뺌): 칸반, 목록, 표, 상세, 오른쪽 패널, 담당 필터. owner 데이터는 그대로. 캡처 docs/exports/board-list/*-clean.png 다시 찍음."}, {"at": "2026-11-23 14:50:17", "by": "[디자인 14]", "text": "추가 반영(11-23 Leader 전달): 담당이 Leader인 일은 화면에 '운영'으로, 담당 필터도 운영. 검토자가 Leader면 상세의 '검토' 줄, 표의 검토 칸, 칸반 카드의 검토 표시에서 뺌. 데이터는 그대로."}, {"at": "2026-11-23 14:55:41", "by": "Leader", "text": "11-23 사용자 확정"}], "milestone": false}, {"id": "TSK-161", "wbs": "3.28", "parent": "TSK-003", "title": "일정판에 일 하나로 바로 가는 링크(#TSK-번호) 넣기", "area": "design", "owner": "[디자인 14]", "reviewer": "Leader", "verify": "agent", "status": "done", "start": "2026-11-23", "due": "2026-11-23", "deps": [], "relates": [], "decisions": [], "commits": [], "refs": [], "screens": [], "figma": [], "desc": "11-23 사용자: 답할 때 TSK 링크를 주고 사용자도 TSK로 묻도록. 보드를 비공개 아티팩트로 올리고 주소#TSK-086 으로 그 일을 바로 펼침. 옛 담당 Claude도 분야 이름으로 보이게. 데이터와 커밋은 건드리지 않음", "acceptance": ["주소 뒤 #TSK-086 으로 열면 목록 보기에서 그 묶음이 펼쳐지고 그 줄이 펼쳐진 채 화면 가운데로 옴", "필터에 가려져 있으면 전체로 바꿔서 보여 줌", "열린 상태에서 해시가 바뀌면(hashchange) 그 일로 이동", "일을 펼치면 주소의 해시가 그 번호로 바뀌고, 상세에 '링크 복사' 버튼이 있음", "담당 Claude는 그 일의 분야 이름(기획, 디자인, 개발 등)으로 보임", "외부 파일 없이 board.html 한 파일로 동작(아티팩트로 올림)"], "checklist": [], "comments": [{"at": "2026-11-23 14:53:16", "by": "[디자인 14]", "text": "주소#TSK-086(또는 #ISS-xxx)으로 열면 목록 보기에서 묶음, 줄을 펼치고 가운데로 옴. 위쪽 필터, 검색, 상태 칩에 가려지면 풀고 전체로. hashchange 따라감. 펼치면 해시가 그 번호, 접으면 해시 지움. 상세에 '링크 복사'(클릭 안에서 clipboard.writeText, 실패하면 링크 글자 칸을 골라 둠). 탭, 검색, 필터는 해시 대신 localStorage에 저장(옛 #tab= 주소도 읽음). 옛 담당 Claude는 화면에서 분야 이름(개발 14, 기획 12, 디자인 5). 외부 파일 없음. 검사: playwright로 1~6 확인, 오류 0. 주의: 아티팩트 안에서 복사되는 주소는 document.referrer가 claude.ai면 그 주소, 아니면 틀 안 주소라 올린 뒤 한 번 확인 필요."}, {"at": "2026-11-23 14:55:07", "by": "Leader", "text": "아티팩트 2판으로 올림. 링크 복사 주소를 https://claude.ai/artifact/E1UdTv9hCMTq4YTKQGbuF2 로 고정(tools/pm/publish_board.py)"}], "milestone": false}, {"id": "TSK-163", "wbs": "3.29", "parent": "TSK-003", "title": "'정말 깼어요?' 확인 화면, 알림 안내, 전체 설정 줄 피그마 그리기", "area": "design", "owner": "[디자인 14]", "reviewer": "Leader", "verify": "agent", "status": "done", "start": "2026-11-23", "due": "2026-11-23", "deps": ["TSK-162"], "relates": ["TSK-086", "TSK-088"], "decisions": [], "commits": [], "refs": [], "screens": [], "figma": [], "desc": "11-23 사용자 '기획 디자인까지는 진행해봐'. TSK-162 결정대로 그려요: 1) '정말 깼어요?' 확인 화면(밀어서 해제 또는 10초 길게 누르기, 라이트/다크) 2) 1차 '깼어요' 뒤 알림 창 안내 모양 3) 앱 전체 설정의 새 줄과 시트 4) S4 시트에서 빠지거나 바뀌는 부분. 기존 디자인 유지, 아이콘은 Lucide", "acceptance": ["TSK-162 결정의 화면 목록이 피그마에 모두 있음(라이트, 다크)", "프레임 이름은 docs/pm/naming.md를 따름", "S4 시트 변경분 반영(TSK-086 내용 포함)", "캡처를 docs/exports에 두고 Leader에게 보고", "W2 '깼어요'도 W3와 같은 길게 누르기 진행 버튼(라이트, 다크)"], "checklist": [], "comments": [{"at": "2026-11-23 15:24:28", "by": "Leader", "text": "11-23 사용자 추가: W2 '깼어요'도 W3처럼 길게 누르기 진행 버튼으로(결정 145 9-1). 10초, 같은 부품"}, {"at": "2026-11-23 15:24:44", "by": "Leader", "text": "11-23 사용자: W2, W3는 due": "2026-11-24", "deps": ["TSK-162"], "relates": ["TSK-138"], "decisions": ["136", "137", "139", "145"], "commits": ["8131369"], "refs": [], "screens": [], "figma": [], "desc": null, "acceptance": ["TSK-162 규칙 3개 반영(놓쳤을 때 한 번 더 크게 묻기, 재울림 상한, 알람 변경, 끄기, 다음 알람 때 남은 확인 취소)"], "checklist": [], "comments": [{"at": "2026-11-24 11:30:21", "by": "[개발 14]", "text": "결정 145와 9-1 반영. 전체 설정 카드와 T1-1, T1-2 시트, 편집 줄 토글만, W2와 W3 10초 길게 누르기, 안내 알림(누르면 W3), 홈 띠, 바퀴 상한 2, 남은 확인 취소, 통화 중 미루기, 재부팅 10분 규칙, 진단 기록. 못 한 것: 결정 143 도우미(방해 금지 막힘 검사, 볼륨 0이면 최소로)는 코드에 아직 없어 W3 소리에 적용 못 함, 볼륨 0이면 진단 기록만. 예전 알람마다 값 DB 칸은 남겨 둠. 디버그 adb 명령 WAKE_CHECK 추가(docs/qa/README.md)."}, {"at": "2026-11-24 11:56:01", "by": "Leader", "text": "11-24 Leader adb 시험(S24+, 알람 볼륨 최저 1/15): 시험 알람 D → 미션 → W1 → 1분 뒤 W2 10초 누르기 → 홈 띠와 안내 알림('오전 11:55에 한 번 더 물어볼게요') → 1분 뒤 W3 10초 누르기 → 띠와 알림 사라짐. 전부 정상. 깼는지 묻기 설정(3분, 60초, 10분)과 볼륨 7 원래대로. 캡처 docs/exports/tsk-088/"}, {"at": "2026-11-24 11:56:34", "by": "Leader", "text": "11-24 사용자 통과"}], "milestone": false}, {"id": "TSK-089", "wbs": "4.32", "parent": "TSK-004", "title": "수면 라운지 숨김과 하단 메뉴 탭 2개, 재생 서비스 선언 빼기", "area": "dev", "owner": "[개발 14]", "reviewer": "[QA 1]", "verify": null, "status": "done", "start": "2026-11-23", "due": "2026-11-24", "deps": [], "relates": ["TSK-139"], "decisions": ["140", "141"], "commits": ["7e967eb", "7ef34c6"], "refs": [], "screens": [], "figma": [], "desc": null, "acceptance": [], "checklist": [], "comments": [{"at": "2026-11-23 15:00:35", "by": "Leader", "text": "1차 제외(결정 140, 141)를 실제로 하는 일이라 보류하지 않고 진행해요(11-23 Leader)"}, {"at": "2026-11-23 15:40:17", "by": "[개발 14]", "text": "SLEEP_LOUNGE=false 스위치로 잠들기 탭 숨김, 하단 메뉴 알람과 설정 2개. 앱 매니페스트에서 잠들기 재생 서비스와 MEDIA_PLAYBACK 권한 제거(합친 매니페스트 확인). feature/sleep 코드는 그대로. 전체 단위 시험과 detekt 통과. 커밋 7e967eb. S24+ 15:40 설치"}, {"at": "2026-11-23 15:48:35", "by": "[개발 14]", "text": "출시 빌드 lint가 매니페스트 서비스 빼기 줄을 Instantiatable 오류로 잡아 tools:ignore 추가(7ef34c6). 출시 합친 매니페스트에도 재생 서비스와 권한 없음 확인"}, {"at": "2026-11-24 10:46:32", "by": "Leader", "text": "11-24 사용자 폰 확인 통과"}], "milestone": false}, {"id": "TSK-094", "wbs": "4.33", "parent": "TSK-004", "title": "기기 호환성 대책 4개 (방해 금지 검사, 볼륨 0 올림, 강제 종료 흔적, 배터리 제한)", "area": "dev", "owner": "[개발 22]", "reviewer": "[QA 4]", "verify": null, "status": "done", "start": "2026-11-25", "due": "2026-11-27", "deps": [], "relates": ["TSK-177"], "decisions": ["143", "152"], "commits": ["1c4bf94", "2888e0e", "1009bd7"], "refs": [], "screens": [], "figma": [], "desc": null, "acceptance": [], "checklist": [], "comments": [{"at": "2026-11-24 12:47:09", "by": "Leader", "text": "11-24 사용자 사례: 루틴 방해 금지 + 허용 앱만 울림. 검사와 경고는 TSK-177 기획 표가 나온 뒤 맞춰서 만듦"}, {"at": "2026-11-26 10:33:06", "by": "Leader", "text": "TSK-177 물을 것 8개 확정(11-26, docs/decisions-11-26.md 아래 표). 방해 금지 검사 다섯 때, 밤 9시 내일 알람 점검, 강제 종료 흔적 문구, 배너 순서, 12에서만 정확한 알람, 울리는 동안 방해 금지 바꾸기(켰을 때만)까지 이 일로. 화면은 TSK-220 시안 뒤"}, {"at": "2026-11-26 10:39:58", "by": "Leader", "text": "TSK-214 결과: 방해 금지 검사는 getCurrentInterruptionFilter + getConsolidatedNotificationPolicy의 ALARMS로. 모드가 켜지는 순간 울리던 알람 진동도 끊김. 허용 앱 여부는 알람과 무관"}, {"at": "2026-11-26 11:05:46", "by": "[개발 21]", "text": "1단위 끝(커밋 1c4bf94, 2888e0e): 알람 볼륨 0이면 울리는 동안 최대의 30%로 올리고 끈 뒤 되돌림(알람 소리, W2/W3 알림음). 다음: 방해 금지와 배터리 '제한' 검사"}, {"at": "2026-11-26 11:15:31", "by": "[개발 21]", "text": "2단위 끝(1009bd7): 방해 금지 알람 막힘과 배터리 '제한' 검사(앱 열 때), 홈 배너 순서와 '그 밖에 n개 더', H2-6/7/8 글. 남은 것: 저장 때 경고 시트, 10분 전과 울린 뒤 검사, 밤 9시 내일 알람 점검, 강제 종료 흔적, 12에서만 정확한 알람 줄, 울리는 동안 방해 금지 바꾸기, T2-1 화면"}, {"at": "2026-11-26 11:16:32", "by": "Leader", "text": "11-26 [개발 21] 2단위까지(1c4bf94, 2888e0e, 1009bd7). 남은 7개는 docs/handover/dev-21-handover.md, [개발 22]가 이어받음"}, {"at": "2026-11-26 11:50:38", "by": "[개발 22]", "text": "7단위 완료: 저장 경고 창(b4b0eec), 10분 전과 울린 뒤 방해 금지 점검(b4f490f), 밤 9시 내일 알람 점검(ead5ead), 강제 종료 흔적 알림과 놓친 알람 문구(9476751), 안드로이드 12만 정확한 알람 줄(fa06084), 울리는 동안 방해 금지 알람만 허용 켠 사람만(63fc56d, 설정 탭 '방해 금지 잠깐 풀기'), T2-1 안내 화면(fc9a72a). 빌드, 단위 시험, detekt 통과. 폰 시험은 [QA 2]에 넘김. 남은 확인: 소리 없이 울림 창과 방해 금지 잠깐 풀기 줄은 시안 없음(추천 문구), 안드로이드 10 이하 강제 종료 판정은 어림, BatteryReminder 알림 id 5가 ESCAPE 알림 id 5와 겹침(원래 있던 문제), 권한 화면 '방해 금지 모드 예외' 줄은 접근 권한 화면으로 두고 T2-1로 바꾸지 않음"}, {"at": "2026-11-26 14:06:59", "by": "[QA 3]", "text": "코드 검토, 단위 시험 통과(b3501ed, 596개 중 실패는 TSK-227 것 1개뿐), detekt 통과. 확인: 저장 경고 S0-2/S0-3 순서와 두 버튼 모두 저장, 밖 누르면 저장 안 함 / 10분 전 점검 예약과 울린 뒤 '소리 없이 울렸어요' 창 / 밤 9시 점검 4문제 한 푸시와 '그 밖에 n개' / 놓친 알람 문구 셋 나눔 / 정확한 알람 줄 API 31, 32만 / 방해 금지 잠깐 바꾸기는 켠 사람만, 끈 뒤 되돌림, 중간에 사용자가 바꾸면 둠 / T2-1 배너, 저장 경고, 소리 없이 울림 창에서 열림. 결함 ISS-054(강제 종료 흔적, 11 이상에서 예약 지워짐도 같이 봐야 함). 폰 확인 못 함: 안드로이드 12 정확한 알람 줄, 안드로이드 15 이상에서 앱의 방해 금지 바꾸기가 사용자 모드를 실제로 푸는지(15부터 앱 규칙으로 바뀜). 참고: 10분 전 점검은 진단 기록만 남김(사용자에게 보이는 것 없음), 안드로이드 12~14는 합친 정책을 못 읽어 갤럭시 모드를 놓칠 수 있음, T2 '방해 금지 모드 예외' 줄은 T2-1로 안 감(문서 R2와 다름, 기획 판단 필요). Z플립5 확인 남아 승인 보류"}, {"at": "2026-11-26 14:16:19", "by": "[개발 22]", "text": "QA 고침(e2b3e17): ISS-054 강제 종료 흔적을 안드로이드 11 이상에서도 '닫힘 기록 또는 켜진 알람 예약이 모두 지워짐'으로 알아챔. T2 '방해 금지 모드 예외' 줄을 누르면 T2-1로. 10분 전 점검은 permission-matrix R2 '막혀 있으면 R3', R3 '켜지 않았으면 기록만'과 같아 그대로(잠깐 풀기를 켠 사람은 울릴 때 알람만 허용으로 바꿈)"}, {"at": "2026-11-26 15:24:34", "by": "[QA 4]", "text": "반려: Z플립5(안드 16, 2c24b44) 통과: 저장 경고 S0-2 '설정 열기'→T2-1, 권한 꺼짐 저장 경고, T2 방해 금지 줄→T2-1, 권한 모두 켜면 홈 경고 없음, 강제 종료 흔적(ISS-054 해결), 밤 9시 점검 명령(문제 없을 때 배터리 글, 방해 금지 막힘 때 '내일 알람이 소리 없이 울릴 수 있어요'). 반려 이유: ISS-057(high) 안드 16에서 '방해 금지 잠깐 풀기'가 소리를 못 풀고 앱 규칙이 남음. 폰 확인 못 함: 안드로이드 12 정확한 알람 줄"}, {"at": "2026-11-26 15:25:08", "by": "[개발 23]", "text": "ISS-057 고침(45e22b5): 강제 종료 뒤 방해 금지 되돌리기, 안드로이드 15+에서는 잠깐 풀기 대신 T2-1 '알람 허용' 안내. 한계는 docs/permission-matrix.md R3에 적음. Z플립5(안드로이드 15+)에서는 토글이 안내 화면으로 가는지, 흐름 로그 dnd_cannot_override 확인 필요"}, {"at": "2026-11-27 10:33:16", "by": "[QA 5]", "text": "Z플립5(안드 16, 08ef902, 45e22b5 포함) 재시험 통과: 설정 '방해 금지 잠깐 풀기' 누르면 T2-1 '방해 금지 중에도 울리게'로 가고 토글은 꺼진 채(enabled=false). 방해 금지 접근 권한을 켜고 앱을 열자 옛 판이 남긴 앱 규칙을 끔(dnd_leftover_restored app_rule_off, zen_mode 3→0). 단, 권한이 꺼져 있으면 남은 규칙을 못 꺼서 폰이 '알람만 허용'에 머묾(ISS-059, low, 45e22b5 전 판에서만 생김). 권한은 처  "start": "2026-11-23", "due": "2026-11-24", "deps": [], "relates": [], "decisions": [], "commits": ["303aecb"], "refs": ["docs/test-alarm-cases.md"], "screens": [], "figma": [], "desc": "11-23 사용자: 알람 시험 시나리오를 앱 안에 넣지 말고 Claude가 직접 관리. 설정의 '시험' 페이지(TestToolsPage, DebugAlarmTools, 시험 A~G, 배터리 알림 보내기)를 화면에서 빼고, 같은 기능을 디버그 빌드에서만 adb 명령(am broadcast 등)으로 부를 수 있게 해요. 울림, 미션, 깼어요, 끄기 같은 이벤트를 logcat에 한 줄씩(태그 하나) 남겨 로그 파일로 뽑을 수 있게 해요", "acceptance": ["설정에 '시험' 줄과 페이지가 없음(디버그, 출시 모두)", "adb 명령 하나로 시험 A~G 알람과 배터리 알림을 걸 수 있음(디버그 빌드만, 출시 빌드에는 입구 없음)", "알람 흐름 이벤트가 한 태그로 logcat에 남음(시각, 알람 id, 이벤트 이름)", "명령 목록과 사용법을 docs/qa/README.md에 적음"], "checklist": [], "comments": [{"at": "2026-11-23 16:25:00", "by": "[개발 14]", "text": "설정 '테스트' 줄, 페이지, 견본 화면 지움. 디버그 전용 DebugCommandReceiver(app/src/debug, DUMP 권한)로 시험 알람 A~G(--es case, --ei in_minutes)와 배터리 알림. 출시 합친 매니페스트에 입구 없음 확인. 흐름 로그 태그 MorningFlow(at, alarm, event, phase, effects). 사용법 docs/qa/README.md. 전체 시험, detekt, 출시 빌드 통과. S24+ 16:24 설치, 틀린 case로 입구 응답만 확인(알람은 걸지 않음)"}, {"at": "2026-11-24 10:46:32", "by": "Leader", "text": "11-24 사용자 폰 확인 통과"}], "milestone": false}, {"id": "TSK-166", "wbs": "4.48", "parent": "TSK-004", "title": "설정에 임시 화면 모드 고르기(자동, 라이트, 다크) 넣기", "area": "dev", "owner": "[개발 14]", "reviewer": "Leader", "verify": "user", "status": "done", "start": "2026-11-23", "due": "2026-11-24", "deps": [], "relates": [], "decisions": [], "commits": ["c034629"], "refs": [], "screens": [], "figma": [], "desc": "11-23 사용자: 설정에서 임시로 다크, 라이트를 수동으로 바꿔 보고 싶음(사용자가 직접 확인). 지금은 시각에 따라 아침 라이트, 밤 다크. 설정 맨 아래쪽에 '화면 모드(임시)' 줄 하나, 자동(지금처럼 시각), 라이트, 다크. 앱 전체(울림 화면 포함)에 바로 적용되고 앱을 다시 열어도 유지. 디버그 빌드에만 보이고 출시 빌드에는 없음. 출시 전에 뺄지 남길지 사용자에게 다시 물음", "acceptance": ["설정에 '화면 모드(임시)' 줄이 있고 자동, 라이트, 다크를 고를 수 있음", "고르면 앱 전체가 바로 바뀌고 다시 열어도 유지", "출시 빌드에는 줄이 없음", "첫 설치 단위에 같이 넣어 사용자가 폰에서 확인"], "checklist": [], "comments": [{"at": "2026-11-23 15:48:35", "by": "[개발 14]", "text": "설정 맨 아래 카드(디버그 전용, '테스트' 줄 위)에 '화면 모드(임시)' 줄. 누를 때마다 자동→라이트→다크. 앱 전체와 울림 화면(하늘 포  눌러도 커서가 깜박이지 않게 고치기", "area": "dev", "owner": "[개발 25]", "reviewer": "Leader", "verify": "agent", "status": "done", "start": "2026-11-27", "due": "2026-11-27", "deps": [], "relates": [], "decisions": [], "commits": ["9526970"], "refs": [], "screens": [], "figma": [], "desc": null, "acceptance": ["드럼롤 터치 때 커서 깜박임 없음"], "checklist": [], "comments": [{"at": "2026-11-27 10:20:26", "by": "[개발 25]", "text": "드럼롤 가운데 시, 분을 누르면 숫자 입력 칸이 겹쳐 뜨는데, 그 칸의 커서를 투명으로 바꿔 깜박임이 안 보여요. 숫자 직접 입력은 그대로 되고, 입력 중은 숫자 색(primary/text)으로 알 수 있어요. 편집 시험 통과. 폰 확인: 알람 편집에서 시, 분 숫자를 눌러 깜박이는 막대가 없는지."}, {"at": "2026-11-27 11:05:04", "by": "[QA 5]", "text": "Z플립5(56545f7) 통과: 알람 편집에서 분을 눌러 숫자 키보드가 뜬 상태로 세 번 캡처, 깜박이는 막대 없음. feature:edit 단위 시험 통과"}], "milestone": false}, {"id": "TSK-254", "wbs": "4.90", "parent": "TSK-004", "title": "전원 끄기 방지를 켜도 물리 버튼 전원 메뉴로 꺼지는 문제 조사하고 고치기", "area": "dev", "owner": "[개발 25]", "reviewer": "Leader", "verify": "agent", "status": "review", "start": "2026-11-27", "due": "2026-11-28", "deps": [], "relates": [], "decisions": [], "commits": ["1b33793"], "refs": [], "screens": [], "figma": [], "desc": null, "acceptance": ["갤럭시 전원 메뉴를 막을 수 있는 범위 조사 결과", "막을 수 있으면 고침, 못 막으면 이유와 대안"], "checklist": [], "comments": [{"at": "2026-11-27 10:23:26", "by": "[개발 25]", "text": "조사 결과. (1) 안드로이드 일반 앱은 전원 버튼 신호 자체를 받을 수 없어요. 막는 방법은 접근성 서비스가 전원 메뉴 창이 뜨는 순간 '뒤로'로 닫는 것뿐이고, 알라미 같은 앱도 같은 방식이에요. 기기 관리자, 기기 소유자 권한으로도 전원 끄기는 못 막아요(삼성 Knox는 기업용 라이선스가 필요). (2) 원인으로 본 것: 우리 앱은 '미션 중'에만 막고 있었어요. 울림 화면에서 '미션 시작'을 누르기 전이나 다시 울림 사이(쉬는 중)에 측면 버튼으로 전원 메뉴를 열면 그대로 꺼졌어요. 또 삼성 전원 메뉴 창 이름이 우리가 찾던 이름과 다를 수 있어요. (3) 못 막는 것: 측면 버튼+볼륨 아래 7초 강제 재시작(하드웨어 수준), 배터리 방전, 사용자가 접근성 권한을 끄거나 삼성이 서비스를 멈춘 경우. 대안은 꺼도 다시 켜면 알람이 다시 울리게 하는 것(TSK-255와 이어짐)."}, {"at": "2026-11-27 10:23:27", "by": "[개발 25]", "text": "고친 것: 전원 종료 방지가 울림, 쉬는 중, 미션 중 모두 동작(W2, W3 확인 중에는 안 함, 미션 없는 알람은 그대로 안 함). 전원 메뉴 창 이름을 GlobalActions, PowerMenu, PowerOptions, Shutdown과 삼성 패키지까지 넓게 잡음. 서비스 연결(power_guard_connected), 닫음(power_menu_closed pkg/cls/ok), xt": "research/J-challenger-brand.md 작성. 추천: 이름 없는 암시형 도전자 카피. 대표 실명/발언 인용 금지(사실도 명예훼손 가능, 퍼블리시티권, 저작권). 월 1천만 명은 확인, 유료 5%와 8,900원은 출처 없음, 사용자 계산은 회사 매출보다 커서 안 맞음(현실 유료 약 9만 명). 월 200만 원엔 정상가에 따라 약 530~1,400명 필요. 메타 시간대 광고는 총 예산으로 가능."}, {"at": "2026-11-24 11:41:48", "by": "[리서치 1]", "text": "Leader 보충 반영: 실명을 막지 않고 '비방 아닌 유머면 가능한 조건'으로 3절을 다시 씀. 윈윈 사례 추가(BMW-벤츠 회장 은퇴 2019, 버거킹 맥와퍼 2015, 쿠팡이츠-배민 수고했상 2021, BMW-아우디). 추천안을 '선배님께 인사하는 막내' 실명 캠페인(SNS 먼저, 유료 광고는 반응 뒤, 숫자는 근거 전 금지)으로 바꿈."}, {"at": "2026-11-24 11:42:04", "by": "Leader", "text": "윈윈 사례와 조건 반영 확인. 5%, 8900원은 사용자 직접 확인 값(11-24)"}, {"at": "2026-11-24 11:42:58", "by": "[리서치 1]", "text": "보충 2 반영(최종본): 유료 5%, 월 8,900원은 사용자 직접 확인 값(11-24)으로 적음. 매출과 안 맞는 점은 6절 메모로만 남김. 8,900원 카피는 캡처 근거 보관 조건으로 '아슬'."}, {"at": "2026-11-24 11:45:47", "by": "Leader", "text": "11-24 사용자 지시: 도전자 브랜드는 여기까지, 결정 3개(말투, 내는 순서, 변호사 확인)는 다음에"}], "milestone": false}, {"id": "TSK-175", "wbs": "8.9", "parent": "TSK-168", "title": "알라미 비상 탈출 동작 조사 (언제 나오는지, 어떻게 끄는지, 사용자 반응)", "area": "research", "owner": "[리서치 1]", "reviewer": "Leader", "verify": null, "status": "done", "start": "2026-11-24", "due": "2026-11-24", "deps": [], "relates": [], "decisions": [], "commits": [], "refs": [], "screens": [], "figma": [], "desc": "11-24 사용자 아이디어. 우리도 비상 탈출이 필요, 이름은 다르게. 예전 결정은 '비상 탈출 없음'(docs/dev-plan.md 21행). 근거 research/A-competitors.md 83, 115행", "acceptance": ["알라미에서 비상 탈출이 언제 보이고 어떻게 끄는지 화면 순서로 정리", "유료, 무료 차이와 설정 위치", "리뷰에서 나온 사용자 반응(좋음, 악용)", "다른 앱 2~3개 비교와 우리 이름 후보 방향", "출처 링크"], "checklist": [], "comments": [{"at": "2026-11-24 12:50:40", "by": "[리서치 1]", "text": "research/K-emergency-escape.md 작성. 알라미 화면 순서(옛 100번 누르기, 지금 10번+다짐 글), 유료/무료와 설정, 리뷰 반응, 다른 앱 4개 비교, 이름 방향 3개와 동작 추천안. 공식 도움말 원문은 403으로 못 읽어 검색 요약과 블로그로 확인"}, {"at": "2026-11-24 12:53:22", "by": "Leader", "text": "Leader 검토: 알라미 동작(늘 보임, 쓸수록 귀찮게, 매달 초기화), 반응, 비교, 우리 추천 방향 확인. TSK-176로 넘김"}], "milestone": false}, {"id": "TSK-183", "wbs": "8.10", "parent": "TSK-168", "title": "자발적 후원 창구 법과  "commits": ["aff2aef"], "refs": [], "screens": [], "comments": [{"at": "2026-11-24 15:42:07", "by": "[개발 15]", "text": "판별 기준과 근거: 안드로이드에는 '터치를 대신하는 서비스'를 알려 주는 공통 표시가 없어요. 제스처 보내기 권한(canPerformGestures)이나 키 입력 가로채기는 자동화, 버튼 매핑 앱도 가져서 기준으로 쓰면 이번처럼 잘못 꺼져요. 그래서 (1) 터치 탐색 켜짐(톡백, 삼성 보이스 어시스턴트) (2) 서비스가 FLAG_REQUEST_TOUCH_EXPLORATION_MODE를 요청 (3) 서비스 이름에 switchaccess, voiceaccess, universalswitch, assistantmenu가 들어 있음, 이 셋일 때만 꺼요. com.sky.browserwipe 같은 일반 앱은 세지 않아요. 새 서비스가 나오면 목록(TrickAccessibility.TOUCH_REPLACING)에 더하면 돼요. 시험 TrickAccessibilityTest 4개, 안내 글 화면 시험 2개. APK: app\\build\\outputs\\apk\\debug\\app-debug.apk (설치 안 함)"}, {"at": "2026-11-24 16:07:30", "by": "Leader", "text": "11-24 Leader S24+ 확인: browserwipe 켜진 채로 미리 해보기와 울림 화면 모두 버튼 3~4개가 자리, 크기 무작위로 움직이고 숨음, 20초 뒤 제자리. trick_end expired=true 기록 정상"}]}, {"id": "ISS-042", "title": "미션 포기 알림이 울림 알림 아래 묶여 접힌 채로는 예문과 버튼이 안 보임", "area": "dev", "status": "resolved", "severity": "medium", "owner": "[개발 15]", "reporter": "Leader", "reviewer": "QA", "task": "TSK-182", "found": "2026-11-24", "resolved": "2026-11-24", "reopen_count": 1, "desc": null, "repro": null, "expected": null, "actual": null, "cause": null, "fix": "미션 포기 알림을 따로 띄우지 않고 울림 알림 하나(울림, 미션 중 ID 1, 쉬는 중 ID 2)에 예문과 '미션 포기' 바로 답장 버튼을 붙임. 그동안 채널은 mission_escape(소리 없는 기본 중요도). 그룹 키(213a1b1)는 되돌림", "relates": [], "commits": ["213a1b1", "0a2786c"], "refs": [], "screens": [], "comments": [{"at": "2026-11-24 15:42:08", "by": "[개발 15]", "text": "근거: 그룹을 정하지 않은 알림이 여럿이면 안드로이드(삼성 One UI 포함)가 앱 이름으로 자동 묶음을 만들어 접어요. 그룹 키를 각각 주면 자동 묶음 대상에서 빠지고, 그룹마다 알림이 하나라 요약 없이 펼쳐진 채로 보여요. 남은 위험: AOSP에는 요약 없는 작은 그룹이 많을 때 강제로 묶는 기능(notification_force_grouping)이 있어요. 우리는 울릴 때 그룹이 2개라 기준에 닿지 않을 것으로 보지만, 삼성 기기에서 어떻게 도는지는 자료로 확인하지 못했어요. 폰에서 알림 창을 내렸을 때 예문과 '미션 포기' 버튼이 바로 보이는지 확인해 주세요. APK: app\\build\\outputs\\apk\\debug\\app-debug.apk (설치 안 함)"}, {"at": "2026-11-24 16:07:30", "by": "Leader", "text": "재발생: 11-24 Leader S24+ 확인: 213a1b1 뒤에도 '알람이 울리고 있어요' 아래 2개로 묶임. dumpsys groupKey가 모두 g const FL = {status: "상태", istatus: "상태", area: "분야", owner: "담당", period: "기간", sev: "심각도", verify: "확인 방법"};
let S = {tab: "list", q: "", f: {}, open: null, cur: null, sort: {list: ["wbs", 1], issues: ["sev", 1]}, fold: {},
  lf: "open", lvg: new Set(GROUPS.filter(g => g.wbs === "3" || g.wbs === "4").map(g => g.id)), lvr: new Set()};

const LINK_RE = /^#?((?:TSK|ISS)-\d+)$/i;
const linkId = () => { const m = LINK_RE.exec(decodeURIComponent(location.hash)); return m ? m[1].toUpperCase() : null; };
function loadState() {
  try {
    const st = JSON.parse(localStorage.getItem("pm-board-state") || "null"); if (!st) return;
    S.q = st.q || ""; S.f = st.f || {}; if (st.lf) S.lf = st.lf;
  } catch (e) {}
}
function readHash() {   // 옛 주소(#tab=..&q=..)도 읽어 줌
  if (!location.hash.includes("=")) return;
  const h = new URLSearchParams(location.hash.slice(1));
  if (h.get("tab")) S.tab = h.get("tab");
  S.q = h.get("q") || "";
  S.f = {};
  for (const k of Object.keys(FL)) if (h.get(k)) S.f[k] = h.get(k).split(",");
  S.open = h.get("open");
}
function writeHash() {   // 주소에는 지금 펼친 일 번호만 (#TSK-086). 탭, 검색, 필터는 브라우저에 저장
  const id = S.open || (S.tab === "list" ? S.cur : null);
  const want = id ? "#" + id : "";
  try { if (location.hash !== want) history.replaceState(null, "", want || location.pathname + location.search); } catch (e) {}
  try { localStorage.setItem("pm-board-state", JSON.stringify({tab: S.tab, q: S.q, f: S.f, lf: S.lf})); } catch (e) {}
}
function goLink(id) {   // #TSK-086 으로 들어오면 그 일로
  const o = BY[id]; if (!o) return render();
  if (isIss(id) || !o.parent) { S.open = id; if (!fIssues().includes(o) && isIss(id)) { S.f = {}; S.q = ""; $("#q").value = ""; } return render(); }
  S.tab = "list"; S.open = null;
  if (!fTasks().includes(o)) { S.f = {}; S.q = ""; $("#q").value = ""; }   // 위쪽 필터나 검색에 가려졌으면 풀어 줌
  if (!lfPass(o)) S.lf = "all";                                        // 상태 칩에 가려졌으면 전체로
  render(); lvGo(id);
}
const linkOf = id => {
  let base = location.href.split("#")[0];
  try { const r = document.referrer; if (window.top !== window && /^https:\/\/claude\.ai\//.test(r)) base = r.split("#")[0]; } catch (e) {}
  return base + "#" + id;
};
const fields = () => S.tab === "issues" ? F_ISS : F_TASK;

// ---------- 필터 ----------
function valOf(o, k) {
  if (k === "status" || k === "istatus") return [o.status];
  if (k === "area") return [o.area || ""];
  if (k === "owner") return [...new Set([dispName(o.owner) || "(없음)", ...(o.status === "review" && revName(o.reviewer) ? [revName(o.reviewer)] : [])])];
  if (k === "sev") return [o.severity];
  if (k === "verify") return [o.verify || "(없음)"];
  if (k === "period") return PERIODS.filter(p => p.test(o)).map(p => p.k);
  return [];
}
function text(o) {
  return [o.id, o.wbs, o.title, o.desc, o.owner, o.reviewer, o.cause, o.fix, o.repro, o.actual,
    ...(o.commits || []), ...(o.refs || []), ...(o.screens || []), ...(o.decisions || []),
    ...(o.comments || []).map(c => c.text)].join(" ").toLowerCase();
}
function pass(o, keys, skip) {
  if (S.q && !text(o).includes(S.q.toLowerCase())) return false;
  for (const k of keys) {
    if (k === skip) continue;
    const want = S.f[k];
    if (want && want.length && !valOf(o, k).some(v => want.includes(v))) return false;
  }
  return true;
}
const fTasks = () => TASKS.filter(t => pass(t, F_TASK));
const fIssues = () => D.issues.filter(i => pass(i, F_ISS));

function options(k) {
  const pool = k === "istatus" || k === "sev" || S.tab === "issues" ? D.issues : TASKS;
  const keys = S.tab === "issues" ? F_ISS : F_TASK;
  const base = pool.filter(o => pass(o, keys, k));
  const cnt = v => base.filter(o => valOf(o, k).includes(v)).length;
  if (k === "status") return O.task.map(v => [v, L.task[v], cnt(v)]);
  if (k === "istatus") return O.issue.map(v => [v, L.issue[v], cnt(v)]);
  if (k === "sev") return O.sev.map(v => [v, L.sev[v], cnt(v)]);
  if (k === "area") return O.area.map(v => [v, L.area[v], cnt(v)]).filter(x => x[2] || (S.f.area || []).includes(x[0]));
  if (k === "verify") return O.verify.map(v => [v, L.verify[v], cnt(v)]).filter(x => x[2] || (S.f.verify || []).includes(x[0]));
  if (k === "period") return PERIODS.map(p => [p.k, p.label, cnt(p.k)]);
  if (k === "owner") {
    const m = {};
    base.forEach(o => valOf(o, "owner").forEach(v => m[v] = (m[v] || 0) + 1));
    (S.f.owner || []).forEach(v => m[v] = m[v] || 0);
    const live = v => pool.some(o => valOf(o, "owner").includes(v) && !CLOSED.has(o.status) && o.status !== "closed");
    return Object.entries(m).sort((a, b) => (live(b[0]) - live(a[0])) || b[1] - a[1]).map(([v, c]) => [v, v, c]);
  }
}
function optLabel(k, v) { const o = (options(k) || []).find(x => x[0] === v); return o ? o[1] : v; }

function setF(k, vals) { if (vals && vals.length) S.f[k] = vals; else delete S.f[k]; render(); }
function toggleF(k, v) { const cur = new Set(S.f[k] || []); cur.has(v) ? cur.delete(v) : cur.add(v); setF(k, [...cur]); }
function onlyF(k, v, tab) { if (tab) S.tab = tab; S.f[k] = [v]; render(); }

function renderBar() {
  $("#tabs").innerHTML = TABS.map(t => {
    const n = t.k === "issues" ? fIssues().length : t.k === "activity" ? D.events.length : fTasks().length;
    return `<button class="tab" role="tab" data-tab="${t.k}" aria-selected="${S.tab === t.k}">${ic(t.icon, "s")}${t.label}<span class="n num">${n}</span></button>`;
  }).join("");
  const fs = S.tab === "activity" ? [] : fields();
  const any = fs.some(k => S.f[k] && S.f[k].length) || S.q;
  $("#fbtns").innerHTML = fs.map(k => {
    const v = S.f[k] || [];
    if (!v.length) return `<button class="fbtn" data-f="${k}">${FL[k]}${ic("chev", "s dn")}</button>`;
    const shown = v.length <= 2 ? v.map(x => optLabel(k, x)).join(", ") : `${optLabel(k, v[0])} 외 ${v.length - 1}`;
    return `<button class="fbtn on" data-f="${k}">${FL[k]}: ${esc(shown)}<span class="x" data-clear="${k}" aria-label="${FL[k]} 필터 지우기">${ic("x", "s")}</span></button>`;
  }).join("") + (any ? `<button class="reset" id="reset">초기화</button>` : "");
  const c = S.tab === "issues" ? `${fIssues().length} / ${D.issues.length} 이슈` : S.tab === "activity" ? "" : `${fTasks().length} / ${TASKS.length} 일`;
  $("#count").textContent = c;
}

function openMenu(k, btn) {

  const cur = new Set(S.f[k] || []);
  m.innerHTML = `<div class="hd">${FL[k]}</div>` + options(k).map(([v, lab, c]) =>

const closeMenu = () => { $("#menu").hidden = true; };

// ---------- 요약 ----------
function renderStats() {
  const ts = TASKS, is = D.issues;
  const c = s => ts.filter(t => t.status === s).length;
  const lateN = ts.filter(late).length;
  const openI = is.filter(i => OPEN_I.has(i.status)).length;
  const done = c("done"), total = ts.filter(t => t.status !== "cancelled").length;
  const next = MS.find(m => m.due >= TODAY && m.status !== "done");
  const pressed = (k, v) => (S.f[k] || []).length === 1 && S.f[k][0] === v;
  const items = [
    ["doing", c("doing"), L.task.doing, "status"], ["review", c("review"), L.task.review, "status"],
    ["waiting_user", c("waiting_user"), "사용자 " + L.task.waiting_user, "status", c("waiting_user") ? "ask" : ""],
    ["user", ts.filter(t => t.verify === "user" && !CLOSED.has(t.status)).length, "사용자가 볼 QA", "verify"],
    ["late", lateN, "지연", "period", lateN ? "warn" : ""],
    ["open", openI, "열린 이슈", "istatus", openI ? "warn" : ""],
  ];
  // 한 줄 요약. 목록 보기에서는 오른쪽 진행률이 같은 내용을 보여 주니 완료율과 마일스톤은 뺌
  $("#stats").innerHTML = items.map(([v, n, lab, k, cls]) =>
    `<button class="stat ${cls || ""}" data-stat="${k}:${v}" aria-pressed="${pressed(k, v)}"><b>${n}</b>${lab}</button>`).join("")
    + (S.tab === "list" ? "" : `<span class="stat-sep" aria-hidden="true"></span><span class="stat"><b>${Math.round(done / Math.max(total, 1) * 100)}%</b>완료 ${done} / ${total}</span>`
    + (next ? `<button class="stat" data-open="${next.id}">${esc(next.title.split("(")[0].trim())} ${fmtD(next.due)}<b>${dnum(next.due) === 0 ? "오늘" : "D-" + dnum(next.due)}</b></button>` : ""));
}

const sevTag = s => `<span class="sev sev-${s}">${s === "high" ? ic("alert", "s") : ""}${esc(L.sev[s])}</span>`;

const keyOf = o => `<span class="key">${o.id}${o.wbs ? " · " + o.wbs : ""}</span>`;

// ---------- 보드 ----------
function viewBoard() {
  const ts = fTasks();
  const cols = O.task.filter(s => !(S.f.status && S.f.status.length) || S.f.status.includes(s));
  return `<div class="kb">` + cols.map(s => {
    const list = ts.filter(t => t.status === s).sort((a, b) => (a.due || "9") < (b.due || "9") ? -1 : 1);
    const fold = S.fold[s] ?? (s === "cancelled");
    const lim = S.fold["more-" + s] ? 999 : 40;

    return `<section class="col ${fold ? "fold" : ""}" data-st="${s}">

  }).join("") + `</div>`;
}
function card(t) {
  const ck = t.checklist || [], cd = ck.filter(x => x.done).length, iss = issuesOf(t.id).filter(i => OPEN_I.has(i.status)).length;
  return `<button class="card" data-open="${t.id}" aria-current="${S.open === t.id}">

    <div class="tt">${esc(t.title)}</div>
    <div class="r3">${who(t.status === "review" && revName(t.reviewer) ? t.reviewer : t.owner)}${t.status === "review" && revName(t.reviewer) ? `<span class="meta">${ic("eye", "s")}검토</span>` : ""}${t.verify === "user" ? `<span class="meta" title="사용자가 실제 폰으로 확인">${ic("phone", "s")}사용자</span>` : ""}<span class="sp"></span>
      ${ck.length ? `<span class="meta num">${ic("listchecks", "s")}${cd}/${ck.length}</span>` : ""}
      ${(t.comments || []).length ? `<span class="meta num">${ic("msg", "s")}${t.comments.length}</span>` : ""}
      ${iss ? `<span class="meta num" style="color:var(--err-text)">${ic("bug", "s")}${iss}</span>` : ""}
      ${t.due ? `<span class="meta num ${late(t) ? "late" : ""}">${ic("cal", "s")}${fmtD(t.due)}</span>` : ""}</div></button>`;

// ---------- 목록 ----------
const sevRank = {high: 0, medium: 1, low: 2};
function sorter(kind) {
  const [k, dir] = S.sort[kind];
  const v = o => {
    if (k === "wbs") return (o.wbs || "").split(".").map(n => n.padStart(4, "0")).join(".");
    if (k === "sev") return sevRank[o.severity] * 10 + (OPEN_I.has(o.status) ? 0 : 5);
    if (k === "status") return (kind === "issues" ? O.issue : O.task).indexOf(o.status);
    if (k === "again") return -(o.reopen_count || 0);
    return o[k] ?? "~";
  };
  return (a, b) => { const x = v(a), y = v(b); return (x < y ? -1 : x > y ? 1 : 0) * dir || (a.id < b.id ? -1 : 1); };
}
function th(kind, k, lab) {
  const [sk, dir] = S.sort[kind];
  const on = sk === k;
  return `<th ${on ? `aria-sort="${dir > 0 ? "ascending" : "descending"}"` : ""}><button data-sort="${kind}:${k}">${lab}${ic(on ? (dir > 0 ? "up" : "down") : "sort", "s")}</button></th>`;
}
function viewList() {
  const ts = fTasks().sort(sorter("list"));
  if (!ts.length) return `<div class="empty">조건에 맞는 일이 없어요</div>`;
  const grouped = S.sort.list[0] === "wbs";
  let last = null, rows = "";
  for (const t of ts) {
    if (grouped && t.parent !== last) { last = t.parent; const g = BY[t.parent]; rows += `<tr class="grp"><td colspan="8">${esc(L.area[g.area])} <span class="key">${g.id} · ${g.wbs}</span></td></tr>`; }
    rows += `<tr tabindex="0" data-open="${t.id}" aria-current="${S.open === t.id}"><td>${keyOf(t)}</td><td class="tt">${t.milestone ? ic("flag", "s") + " " : ""}${esc(t.title)}</td>
      <td>${stChip(t.status)}</td><td>${areaTag(t.area)}</td><td>${who(t.owner)}</td><td>${revName(t.reviewer) ? `<span class="who">${esc(revName(t.reviewer))}</span>` : ""}</td>
      <td class="num">${fmtD(t.start)}</td><td class="num ${late(t) ? "late" : ""}">${fmtD(t.due)}</td></tr>`;
  }
  return `<div class="tbl"><table><thead><tr>${th("list", "wbs", "키")}${th("list", "title", "제목")}${th("list", "status", "상태")}${th("list", "area", "분야")}${th("list", "owner", "담당")}${th("list", "reviewer", "검토")}${th("list", "start", "시작")}${th("list", "due", "마감")}</tr></thead><tbody>${rows}</tbody></table></div>`;
}

}

// ---------- 간트 ----------
function viewGantt() {
  const ts = fTasks();
  const dated = ts.filter(t => t.start || t.due);
  if (!dated.length) return `<div class="empty">날짜가 있는 일이 없어요</div>`;
  const all = dated.flatMap(t => [t.start || t.due, t.due || t.start]).concat([TODAY]);
  const d0 = new Date(all.reduce((a, b) => a < b ? a : b) + "T00:00"), d1 = new Date(all.reduce((a, b) => a > b ? a : b) + "T00:00");
  d0.setDate(d0.getDate() - 1); d1.setDate(d1.getDate() + 3);
  const days = []; for (let d = new Date(d0); d <= d1; d.setDate(d.getDate() + 1)) days.push(new Date(d));
  const DW = days.length > 70 ? 22 : 28, W = days.length * DW;
  const iso = d => `${d.getFullYear()}-${String(d.getMonth() + 1).padStart(2, "0")}-${String(d.getDate()).padStart(2, "0")}`;
  const x = s => Math.round((new Date(s + "T00:00") - d0) / 864e5) * DW;
  const head = days.map((d, n) => `<div class="day ${d.getDay() === 1 ? "mon" : ""} ${d.getDay() % 6 === 0 ? "we" : ""} ${iso(d) === TODAY ? "td" : ""}"><span class="m">${d.getDate() === 1 || n === 0 ? (d.getMonth() + 1) + "월" : ""}</span>${d.getDate()}</div>`).join("");
  const wk = days.map((d, n) => d.getDay() % 6 === 0 ? `<div class="bl we" style="left:${n * DW}px;width:${DW}px"></div>` : "").join("");
  const lines = `${wk}<div class="bl today" style="left:${x(TODAY) + DW / 2}px" title="오늘"></div>` + MS.map(m => `<div class="bl msl" style="left:${x(m.due) + DW / 2}px"></div>`).join("");
  let rows = "";
  for (const g of GROUPS) {
    const kids = dated.filter(t => t.parent === g.id).sort((a, b) => ((a.start || a.due) < (b.start || b.due) ? -1 : 1));
    if (!kids.length) continue;
    const fold = S.fold["g" + g.id];
    const gs = kids.map(t => t.start || t.due).sort()[0], ge = kids.map(t => t.due || t.start).sort().pop();
    rows += `<div class="lab g" tabindex="0" role="button" aria-expanded="${!fold}" data-gfold="${g.id}">${ic(fold ? "chevr" : "chev", "s")}<span class="tt">${esc(L.area[g.area])}</span><span class="key">${kids.length}</span></div>
      <div class="lane g" style="width:${W}px">${lines}<div class="bar g" style="left:${x(gs)}px;width:${x(ge) - x(gs) + DW}px"></div></div>`;
    if (fold) continue;
    for (const t of kids) {
      const s = t.start || t.due, e = t.due || t.start;
      const bar = t.milestone ? `<div class="ms" data-open="${t.id}" style="left:${x(e) + DW / 2}px" title="${esc(t.title)}"></div>`
        : `<div class="bar b-${t.status}" data-open="${t.id}" style="left:${x(s) + 2}px;width:${x(e) - x(s) + DW - 4}px" title="${esc(t.id + " " + t.title)} (${fmtD(s)}~${fmtD(e)}, ${L.task[t.status]})"></div>`;
      rows += `<div class="lab" tabindex="0" role="button" data-open="${t.id}"><span class="key">${t.id}</span><span class="tt">${esc(t.title)}</span></div><div class="lane" style="width:${W}px">${lines}${bar}</div>`;
    }
  }
  const nod = ts.filter(t => !t.start && !t.due);
  return `<div class="legend">${O.task.map(s => `<span><i class="b-${s}"></i>${L.task[s]}</span>`).join("")}<span><i style="background:var(--sun);transform:rotate(45deg) scale(.8)"></i>마일스톤</span><span><i style="background:var(--sun);width:2px"></i>오늘</span></div>
    <div class="gt" id="gt" style="--dw:${DW}px"><div class="grid"><div class="lh">일</div><div class="dh">${head}</div>${rows}</div></div>
    ${nod.length ? `<div class="nodate">날짜 없음 ${nod.length}개: ${nod.map(t => `<span class="lnk key" data-open="${t.id}">${t.id}</span>`).join("")}</div>` : ""}`;
}

// ---------- 기록 ----------
function evText(e) {

  if (!g) return;
  g.open = true; S.lvg.add(gid);
  g.scrollIntoView({behavior: reduceMotion() ? "auto" : "smooth", block: "start"});
}
document.addEventListener("toggle", e => {
  const g = e.target; if (!g.dataset || !g.dataset.lg) return;
  g.open ? S.lvg.add(g.dataset.lg) : S.lvg.delete(g.dataset.lg);
}, true);
const setMH = () => document.documentElement.style.setProperty("--mh", $("#main").clientHeight + "px");
window.addEventListener("resize", setMH);

// ---------- 그리기 ----------
const VIEWS = {list: viewLV, board: viewBoard, table: viewList, gantt: viewGantt, issues: viewIssues, activity: viewActivity};
function render() {
  if (!VIEWS[S.tab]) S.tab = "list";
  renderStats(); renderBar();
  const gt = $("#gt"), keep = gt ? [gt.scrollLeft, gt.scrollTop] : null;
  $("#view").innerHTML = VIEWS[S.tab]();
  const g2 = $("#gt");
  if (g2) { if (keep && keep[0]) [g2.scrollLeft, g2.scrollTop] = keep; else { const t = g2.querySelector(".bl.today"); if (t) g2.scrollLeft = Math.max(0, parseInt(t.style.left) - 420); } }
  renderPanel();
  writeHash();
  setMH();
}

// ---------- 이벤트 ----------
document.addEventListener("click", e => {
  const t = e.target.closest("[data-lrow],[data-lf],[data-lgo],[data-lbar],[data-clear],[data-f],[data-tab],[data-open],[data-only],[data-stat],[data-sort],[data-fold],[data-more],[data-gfold],[data-copy],[data-link],#reset,#close,#theme,#scrim");
  if (!t) { if (!e.target.closest("#menu")) closeMenu(); return; }
  const d = t.dataset;
  if (d.clear) { e.stopPropagation(); closeMenu(); return setF(d.clear, []); }
  if (d.f) { const m = $("#menu"); if (!m.hidden && m.dataset.k === d.f) return closeMenu(); return openMenu(d.f, t); }
  closeMenu();
  if (d.lrow) { const li = t.closest(".lv-row"); return lvSet(li, !li.classList.contains("open")); }
  if (d.lf) { S.lf = d.lf; return render(); }
  if (d.lgo) { e.stopPropagation(); return lvGo(d.lgo); }
  if (d.lbar) return lvBar(d.lbar);
  if (d.tab) { S.tab = d.tab; for (const k of Object.keys(S.f)) if (!fields().includes(k)) delete S.f[k]; return render(); }
  if (d.link) {   // 클릭 안에서 바로 복사, 안 되면 글자를 골라 둠
    const url = linkOf(d.link), done = () => { t.classList.add("ok"); t.innerHTML = ic("check", "s") + "복사됨"; setTimeout(() => { t.classList.remove("ok"); t.innerHTML = ic("link", "s") + "링크 복사"; }, 1400); };
    const fail = () => { let box = t.parentNode.querySelector(".lv-linkbox");
      if (!box) { box = document.createElement("input"); box.className = "lv-linkbox"; box.readOnly = true; box.setAttribute("aria-label", "이 일 링크"); t.after(box); }
      box.value = url; box.focus(); box.select(); };
    try { navigator.clipboard.writeText(url).then(done, fail); } catch (err) { fail(); }
    return;
  }
  if (d.copy) { navigator.clipboard?.writeText(d.copy).then(() => { const old = t.innerHTML; t.innerHTML = ic("check", "s") + "복사됨"; setTimeout(() => t.innerHTML = old, 1200); }); return; }
  if (d.open) { e.stopPropagation(); S.open = d.open; return render(); }
  if (d.only) { const [k, v] = d.only.split(":"); return setF(k, S.f[k]?.length === 1 && S.f[k][0] === v ? [] : [v]); }
  if (d.stat) { const [k, v] = d.stat.split(":"); const tab = k === "istatus" ? "issues" : (S.tab === "issues" || S.tab === "activity") ? "board" : S.tab;
    if (tab !== S.tab) { S.tab = tab; S.f = {}; } return setF(k, S.f[k]?.length === 1 && S.f[k][0] === v ? [] : [v]); }
  if (d.sort) { const [kind, k] = d.sort.split(":"); const [sk, dir] = S.sort[kind]; S.sort[kind] = [k, sk === k ? -dir : 1]; return render(); }
  if (d.fold) { S.fold[d.fold] = !(S.fold[d.fold] ?? d.fold === "cancelled"); return render(); }
  if (d.more) { S.fold["more-" + d.more] = 1; return render(); }
  if (d.gfold) { S.fold["g" + d.gfold] = !S.fold["g" + d.gfold]; return render(); }
  if (t.id === "reset") { S.f = {}; S.q = ""; $("#q").value = ""; return render(); }
  if (t.id === "close" || t.id === "scrim") { S.open = null; return render(); }
  if (t.id === "theme") {
    const dark = document.documentElement.dataset.theme ? document.documentElement.dataset.theme === "dark" : matchMedia("(prefers-color-scheme: dark)").matches;
    document.documentElement.dataset.theme = dark ? "light" : "dark";
    try { localStorage.setItem("pm-theme", document.documentElement.dataset.theme); } catch (err) {}
    t.innerHTML = ic(dark ? "moon" : "sun");
  }
});
$("#menu").addEventListener("change", e => {
  const k = $("#menu").dataset.k;
  setF(k, [...$("#menu").querySelectorAll("input:checked")].map(i => i.value));
  const btn = document.querySelector(`[data-f="${k}"]`); if (btn) openMenu(k, btn);
});
let qt; $("#q").addEventListener("input", e => { clearTimeout(qt); qt = setTimeout(() => { S.q = e.target.value.trim(); render(); }, 120); });
document.addEventListener("keydown", e => {
  if (e.key === "Escape") { if (!$("#menu").hidden) return closeMenu(); if (S.open) { S.open = null; render(); } }
  if ((e.key === "Enter" || e.key === " ") && e.target.matches("[tabindex][data-open],[tabindex][data-gfold],[tabindex][data-lgo]")) { e.preventDefault(); e.target.click(); return; }
  if (e.key === "/" && document.activeElement !== $("#q")) { e.preventDefault(); $("#q").focus(); }
});
window.addEventListener("hashchange", () => { const id = linkId(); if (id) { if (id !== (S.open || S.cur)) goLink(id); return; } if (location.hash.includes("=")) { readHash(); $("#q").value = S.q; render(); } });

// 시작
try { const th = localStorage.getItem("pm-theme"); if (th) document.documentElement.dataset.theme = th; } catch (e) {}
loadState(); readHash();
const startId = linkId();
if (!location.hash.includes("=")) { S.tab = "list"; S.open = null; }   // 처음 열면 목록 보기부터
$("#q").value = S.q;
$("#built").textContent = `${D.built} 기준 · 오늘 ${fmtD(TODAY)}`;
{ const dark = document.documentElement.dataset.theme === "dark" || (!document.documentElement.dataset.theme && matchMedia("(prefers-color-scheme: dark)").matches); $("#theme").innerHTML = ic(dark ? "sun" : "moon"); }
render();
if (startId) goLink(startId);
</script>
</body>
</html>
