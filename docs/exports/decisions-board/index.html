<title>일어나 결정함</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;700&display=swap">
<style>
/* 접힌 한 줄 목록: 번호, 짧은 제목, 추천(또는 고른 답)이 한 줄. 줄을 누르면 설명, 답 버튼, 메모가 펼쳐져요. 위에는 상태 거르기와 날짜 거르기 */
:root{
  --bg:#F2F4F8; --card:#FFFFFF; --fg:#16202C; --muted:#5A6676; --line:#DFE4EC; --hover:#F7F9FC;
  --accent:#2F6BFF; --accent-soft:#E7EEFF;
  --yes:#1E8E5A; --yes-soft:#E2F4EA; --no:#C2412D; --no-soft:#FBE7E3;
  --hold:#8A6A12; --hold-soft:#F8EFD6; --ask:#5B4BC4; --ask-soft:#ECE9FB;
  --font:"Noto Sans KR",system-ui,-apple-system,"Malgun Gothic",sans-serif;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0F141B; --card:#171E28; --fg:#EEF2F8; --muted:#A3AEBE; --line:#29323F; --hover:#1C2430;
  --accent:#6E98FF; --accent-soft:#1D2A47;
  --yes:#5CCB94; --yes-soft:#16322A; --no:#F08B78; --no-soft:#3A1F1B;
  --hold:#E3C266; --hold-soft:#352D16; --ask:#A99BFF; --ask-soft:#26223F; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0F141B; --card:#171E28; --fg:#EEF2F8; --muted:#A3AEBE; --line:#29323F; --hover:#1C2430;
  --accent:#6E98FF; --accent-soft:#1D2A47;
  --yes:#5CCB94; --yes-soft:#16322A; --no:#F08B78; --no-soft:#3A1F1B;
  --hold:#E3C266; --hold-soft:#352D16; --ask:#A99BFF; --ask-soft:#26223F; color-scheme:dark}
body{background:var(--bg);color:var(--fg);font-family:var(--font);line-height:1.5}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--bg)}
.wrap{max-width:820px;margin:0 auto;padding-block:0 64px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--bg);padding-block:18px 12px;display:flex;flex-direction:column;gap:10px;border-bottom:1px solid var(--line)}
.titlerow{display:flex;align-items:baseline;justify-content:space-between;gap:12px;flex-wrap:wrap}
h1{font-size:20px;margin:0}
.status{font-size:12px;color:var(--muted)}
.filters{display:flex;gap:6px 14px;flex-wrap:wrap;align-items:center}
.tabs{display:flex;gap:6px;flex-wrap:wrap;align-items:center}
.tabs .lab{font-size:12px;color:var(--muted);margin-right:2px}
.tabs button{font:inherit;font-size:13px;padding:5px 11px;border-radius:999px;border:1px solid var(--line);background:var(--card);color:var(--fg);cursor:pointer;font-variant-numeric:tabular-nums}
.tabs button[aria-pressed="true"]{background:var(--fg);color:var(--bg);border-color:var(--fg);font-weight:700}
.tabs button:focus-visible,.row:focus-visible,.choices button:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.counts{font-size:12px;color:var(--muted);font-variant-numeric:tabular-nums}
main{display:flex;flex-direction:column;gap:22px;padding-top:18px}
.group{display:flex;flex-direction:column}
.group h2{font-size:13px;color:var(--muted);margin:0 0 8px;font-weight:700;display:flex;gap:8px;align-items:baseline;flex-wrap:wrap}
.group h2 small{font-weight:500;font-variant-numeric:tabular-nums}
.box{background:var(--card);border:1px solid var(--line);border-radius:12px;overflow:hidden}
.q + .q{border-top:1px solid var(--line)}
.row{display:grid;grid-template-columns:40px minmax(0,1fr) auto;align-items:center;gap:10px;padding:10px 12px;cursor:pointer}
.row:hover{background:var(--hover)}
.num{font-size:12px;color:var(--muted);font-variant-numeric:tabular-nums}
.t{font-size:15px;font-weight:500;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.t .memo{font-size:12px;color:var(--accent);margin-left:6px}
.right{display:flex;align-items:center;gap:8px}
.date{font-size:12px;color:var(--muted);font-variant-numeric:tabular-nums}
.rec{font-size:12px;color:var(--muted);white-space:nowrap}
.rec b{color:var(--accent);font-weight:700}
.chip{font-size:12px;font-weight:700;padding:3px 9px;border-radius:999px;white-space:nowrap}
.chip.yes{background:var(--yes-soft);color:var(--yes)} .chip.no{background:var(--no-soft);color:var(--no)}
.chip.hold{background:var(--hold-soft);color:var(--hold)} .chip.ask{background:var(--ask-soft);color:var(--ask)}
.chev{width:16px;height:16px;color:var(--muted);transition:transform .15s;flex:none}
.q.open .chev{transform:rotate(180deg)}
.detail{padding:0 12px 14px 62px;display:flex;flex-direction:column;gap:10px}
.qt{font-size:14px;margin:0}
.why{font-size:13px;color:var(--muted);margin:0}
.why a{color:var(--accent)}
.choices{display:flex;flex-wrap:wrap;gap:6px}
.choices button{font:inherit;font-size:13px;padding:6px 12px;border-radius:9px;border:1px solid var(--line);background:transparent;color:var(--fg);cursor:pointer}
.choices button[aria-pressed="true"][data-v="yes"]{background:var(--yes-soft);color:var(--yes);border-color:transparent;font-weight:700}
.choices button[aria-pressed="true"][data-v="no"]{background:var(--no-soft);color:var(--no);border-color:transparent;font-weight:700}
.choices button[aria-pressed="true"][data-v="hold"]{background:var(--hold-soft);color:var(--hold);border-color:transparent;font-weight:700}
.choices button[aria-pressed="true"][data-v="ask"]{background:var(--ask-soft);color:var(--ask);border-color:transparent;font-weight:700}
.detail textarea{width:100%;box-sizing:border-box;font:inherit;font-size:14px;color:var(--fg);background:var(--bg);border:1px solid var(--line);border-radius:9px;padding:8px 10px;min-height:40px;resize:vertical}
.empty{color:var(--muted);font-size:14px;padding:24px 0;text-align:center}
@media (max-width:560px){.rec,.date{display:none}.detail{padding-left:12px}.row{grid-template-columns:34px minmax(0,1fr) auto}}
@media (prefers-reduced-motion:reduce){.chev{transition:none}}
</style>

<div class="wrap">
  <div class="top">
    <div class="titlerow"><h1>일어나 결정함</h1><span class="status" id="status">저장소에 연결하는 중이에요.</span></div>
    <div class="filters">
      <div class="tabs" role="group" aria-label="상태로 거르기" id="tabs"></div>
      <div class="tabs" role="group" aria-label="올린 날로 거르기" id="dates"></div>
    </div>
    <div class="counts" id="counts"></div>
  </div>
  <main id="list"></main>
</div>

<script>
const ITEMS = [
  {g:"피그마 보드 정리 (11-28 저녁)", id:"D47", t:"화면 페이지: 장 사이 40", d:"11-28", q:"화면 페이지 모든 구역(장 137곳)과 '11-28 오늘 모음' 구역 셋(29곳)의 장 사이를 80에서 40으로 줄였어요(폭 360 장은 400 간격). 줄 사이 160, 구역 사이 200, 안쪽 80은 그대로예요. 확정 1~9 구역은 순서대로 다시 쌓았고 '6 잠들기'를 제자리로 넣었어요. 이 간격이 괜찮나요?", rec:"예", why:"사용자가 '화면간의 사이간격 너무 머네'라고 해서 반으로 줄였어요. 더 좁히거나 넓히려면 메모에 숫자를 적어 주세요."},
  {g:"피그마 보드 정리 (11-28 저녁)", id:"D48", t:"'확인 필요' 구역 정리, 보관 15장", d:"11-28", q:"'작업 중 / 확인 필요' 구역을 없앴어요. 옛 장 15장은 '[보관] 옛 '을 붙여 보관 구역으로 옮겼어요: M5 미션 포기 4장, 실험실 9장(버튼 속이기 6, W3 여러 번 묻기 2, H0 한 번 더 확인 남음 1), H0 한 번 더 확인 남음, 바텀 모달 가이드 초안, MVP 제외 표시, selected band. O3 선택 권한 / 날씨는 확정 1 온보딩의 O1 다음으로 옮겼어요. 이렇게 두어도 되나요?", rec:"예", why:"M5는 따라 쓰기 장이 대신하고, 실험실 장은 Crazy Mode와 좀비모드가 대신하며, 가이드 초안은 Bottom Sheet Guide가 대신해요. 지운 장은 없어요."},
  {g:"피그마 보드 정리 (11-28 저녁)", id:"D49", t:"결정 필요로 옮긴 5장 확정할까", d:"11-28", q:"'결정 필요' 안 새 구역 '확인 필요에서 옮김'에 다섯 장을 두었어요: M1 Drop Words / 미션 포기 알림, H0 다시 울려요 띠, H0 깼는지 물어볼 때 기다림 띠, Pop Quiz 분야 줄 두 장. 이 장들을 지금 모양 그대로 확정본으로 쓸까요?", rec:"예", why:"아직 쓰는 기능인데 확정본이 따로 없어요. 고칠 장이 있으면 메모에 장 이름과 고칠 점을 적어 주세요."},
  {g:"오늘 고친 화면 (11-28) 피드백", id:"D29", q:"확정 / 7 설정 탭: 바텀 모달 헤더를 제목 20 + 오른쪽 원형 X로 바꾸고, T3-4와 권한 시트 세 장(알림, 전체 화면 알림, 다른 앱 위에 표시)을 타입 5 새 장으로 교체했어요. 이대로 괜찮을까요?", rec:"예", why:"결정 244. 옛 확정본 네 장은 '[보관] 옛 '으로 보관했어요. 고칠 점은 메모에 적어 주세요.", link:"https://www.figma.com/design/MazZLYfaQndMh9AxlRcz2v?node-id=399-7379", lt:"확정 / 7 설정 탭"},
  {g:"오늘 고친 화면 (11-28) 피드백", id:"D30", q:"확정 / 3 알람 편집: 카운터 시트 9장(미루기, 다시 잠들기 방지, S3 다시 울림, S6 볼륨, T1-1, T1-2)을 확정 구역으로 옮겼어요. 이대로 괜찮을까요?", rec:"예", why:"결정 245, 246. 옛 S6는 보관했어요. '볼륨 천천히 올리기'는 값을 고르는 줄이라 시트 안에 그대로 뒀어요.", link:"https://www.figma.com/design/MazZLYfaQndMh9AxlRcz2v?node-id=1412-11466", lt:"S6 볼륨 시트"},
  {g:"오늘 고친 화면 (11-28) 피드백", id:"D31", q:"T6 자주 묻는 질문 / Light: 화면 아래 '문의하기'를 빼고 확정 / 7 설정 탭으로 옮겼어요. 이대로 괜찮을까요?", rec:"예", why:"결정 247. 아래 확정 구역 네 개를 340씩 내려 간격 200을 지켰고, 옛 T6는 보관했어요.", link:"https://www.figma.com/design/MazZLYfaQndMh9AxlRcz2v?node-id=399-7379", lt:"확정 / 7 설정 탭"},
  {g:"오늘 고친 화면 (11-28) 피드백", id:"D32", q:"P6 전원 종료 방지 동의, P5 날씨 테마 위치 권한, 다음 알람 항상 표시 켬: 확정 / 7 설정 탭에 넣었어요. 이대로 괜찮을까요?", rec:"예", why:"결정 250. P5, P6는 타입 5 바텀 모달(버튼 하나 + X)이고, 다음 알람 항상 표시는 시트 없이 바로 켜져요. 옛 P5, P6는 보관했어요.", link:"https://www.figma.com/design/MazZLYfaQndMh9AxlRcz2v?node-id=1418-71758", lt:"P6"},
  {g:"오늘 고친 화면 (11-28) 피드백", id:"D33", q:"가운데 팝업(Dialog, Wake Dialog 부품): 폭을 328에서 312로 줄여 양옆 24를 띄웠어요. S0-1~3, P5, T1-4 켜기 확인, W1 해제 완료 6장까지 11곳이에요. 이대로 괜찮을까요?", rec:"예", why:"결정 249. 줄바꿈이 새로 생긴 곳은 없어요. 바텀시트는 그대로 화면 폭 전체예요.", link:"https://www.figma.com/design/MazZLYfaQndMh9AxlRcz2v?node-id=137-709", lt:"Dialog 부품"},
  {g:"오늘 고친 화면 (11-28) 피드백", id:"D34", q:"확정 / 9 홈 권한 안내 띠(H2-1~H2-9)와 나중용 권한 시트 뒤 홈: 띠 앞 아이콘을 빨간 원 + 흰 느낌표로 바꾸고 가운데를 맞췄어요(14곳). 이대로 괜찮을까요?", rec:"예", why:"빨강은 status/error 변수예요. 아이콘 부품 이름은 icon/circle-alert-filled예요.", link:"https://www.figma.com/design/MazZLYfaQndMh9AxlRcz2v?node-id=1331-11727", lt:"홈 권한 띠"},
  {g:"오늘 고친 화면 (11-28) 피드백", id:"D35", q:"확정 / 2 알람 탭 홈, 홈 하늘 장면: 알람 카드 스위치에 켜짐 파란 체크, 꺼짐 회색 X를 넣었어요(92곳). 이대로 괜찮을까요?", rec:"예", why:"Toggle 부품에 'Icon=Yes' 변형 두 개를 더해서 알람 카드에만 끼웠어요. 다른 화면 스위치는 그대로예요. 밤 화면에서도 잘 보여요.", link:"https://www.figma.com/design/MazZLYfaQndMh9AxlRcz2v?node-id=1420-20903", lt:"Toggle 아이콘 변형"},
  {g:"오늘 고친 화면 (11-28) 피드백", id:"D36", q:"디자인 시스템 / Bottom Sheet Guide: '확정 / 3 바텀시트 추천 조합 예제' 구역을 화면 페이지에서 디자인 시스템 페이지 맨 아래로 옮기고, 겹쳐 있던 부품 다섯 개를 한 줄로 정리했어요. 이대로 괜찮을까요?", rec:"예", why:"예제 10장이 지금 규칙과 맞아서 보관한 장은 없어요. 부품을 쓰는 화면은 그대로 이어져요."},
  {g:"오늘 고친 화면 (11-28) 피드백", id:"D37", q:"부품 점검(TSK-329): 덮개 색 변수 41곳, 시트 머리 제목 덮어쓰기 9곳, 필수 권한 시트 권한 줄 부품화 9줄, 알람 편집 줄 칠 덮어쓰기 80곳을 정리했어요. 이대로 괜찮을까요?", rec:"예", why:"고치기 전후 그림을 비교했는데 모양이 바뀐 곳은 없어요. 남은 두 가지는 아래 D40, D41에서 골라 주세요."},
  {g:"오늘 고친 화면 (11-28) 피드백", id:"D38", q:"피그마 전체: 화면 밖 설명 글 181개를 지웠어요(화면 67, 오늘 모음 36, 디자인 시스템 12, 보관 66). 이대로 괜찮을까요?", rec:"예", why:"지운 글은 모두 docs/figma-canvas-notes-archive.md에 옮겨 적었어요. 화면 안 문구, 부품, 구역 위치는 그대로예요."},
  {g:"오늘 고친 화면 (11-28) 피드백", id:"D39", q:"움직임 견본 아티팩트 '설정 설명 그림' 10가지: 진입, 확대 축소를 넣은 설정별 설명 움직임이에요. 마음에 드는 것과 고칠 것을 메모로 남겨 주세요", rec:"예", why:"바텀 모달 그림 칸(312×176) 크기예요. 그림 안에는 글 없이 숫자와 아이콘만 넣었어요.", link:"https://claude.ai/artifact/8KyvN8FPzZj3yj36Cy2Y6L#g1", lt:"움직임 견본 5판"},
  {g:"부품 점검에서 나온 결정 (TSK-329)", id:"D40", q:"알람 편집에서 'PLUS+' 표가 붙은 따로 그린 줄 6개(움직이는 버튼, 좀비모드)를 위해 Setting Row 부품에 'Badge' 보이기/숨기기 속성을 더하고 바꿔 끼울까요?", rec:"예", why:"지금은 부품에 표 자리가 없어서 줄만 따로 그려져 있어요. 속성을 더해도 원본을 쓰는 다른 곳 모양은 그대로예요."},
  {g:"부품 점검에서 나온 결정 (TSK-329)", id:"D41", q:"Sheet Header 부품 원본의 아래 여백과 높이를 16/80에서 12/76으로 바꿀까요?", rec:"예", why:"쓰는 곳 23곳이 이미 12/76으로 덮어써져 있어요. 원본을 바꾸기 전에 80을 그대로 쓰는 곳을 먼저 세어 보고 바꿔요."},
  {g:"피그마 정리에서 남긴 것", id:"D42", q:"화면 페이지 '작업 중 / 확인 필요' 구역(작은 구역 14개)을 통째로 보관 구역으로 옮길까요?", rec:"예", why:"구역 이름부터 '확정인지 옛 것인지 모름'이에요. 지우지 않고 옮기기만 해서 필요하면 다시 꺼낼 수 있어요.", link:"https://www.figma.com/design/MazZLYfaQndMh9AxlRcz2v?node-id=1308-20097", lt:"확인 필요 구역"},
  {g:"피그마 정리에서 남긴 것", id:"D43", q:"화면 페이지 '작업 중 / 11-27 수정, 신규 모음' 30장을 보관 구역으로 옮길까요?", rec:"예", why:"11-27에 고친 장들이고, 그 뒤 확정한 장은 확정 구역에 따로 있어요. 확정 구역에 같은 이름이 없어 자동으로 판단하지 못했어요.", link:"https://www.figma.com/design/MazZLYfaQndMh9AxlRcz2v?node-id=1218-20106", lt:"11-27 모음"},
  {g:"피그마 정리에서 남긴 것", id:"D44", q:"11-28 오늘 모음 '1 오늘 확정' 안에 섞인 옛 T2 복제 한 장을 오늘 확정 모음에서 뺄까요?", rec:"예", why:"이름이 '[보관] 옛 T2'인데 오늘 확정 모음에 들어 있어요. 원본은 보관 구역에 있어요.", link:"https://www.figma.com/design/MazZLYfaQndMh9AxlRcz2v?node-id=1414-44852", lt:"옛 T2 복제"},
  {g:"피그마 정리에서 남긴 것", id:"D45", q:"04 레퍼런스 보드의 앱 이름과 한 줄 캡션(약 90개)도 지울까요?", rec:"아니오, 남겨요", why:"어느 앱 화면인지 알려 주는 이름이라 레퍼런스를 다시 찾을 때 필요해요."},
  {g:"피그마 정리에서 남긴 것", id:"D46", q:"미션 섬네일 판의 이름표 8개, 흔들흔들 판의 '안 A/B/C', 'MVP 제외' 도장도 지울까요?", rec:"아니오, 남겨요", why:"판 안에서 어느 그림인지 가리키는 이름이라 지우면 구분이 안 돼요."},
  {g:"설정 메인 (TSK-324)", id:"D01", q:"설정 줄 앞 아이콘을 뺄까요?", rec:"빼요", why:"카드로 이미 묶여 있고 줄 이름이 짧아요. 하위 화면에도 아이콘이 없어 일관돼요.", link:"https://www.figma.com/design/MazZLYfaQndMh9AxlRcz2v?node-id=1387-11297", lt:"아이콘 뺀 시안"},
  {g:"설정 메인 (TSK-324)", id:"D02", q:"연한 구분선을 넣고 줄 높이를 44에서 52로 맞출까요?", rec:"예", why:"카드 안 줄이 5개라 선이 있어야 줄 단위가 보여요. 두 카드의 줄 사이(4와 0)도 0으로 맞춰요."},
  {g:"설정 메인 (TSK-324)", id:"D03", q:"설정 메인 글자는 14 그대로 둘까요? (하위 화면 제목은 16)", rec:"예, 14 유지", why:"메인은 목록이라 하위 화면 제목보다 한 단계 작게 둬요."},
  {g:"설정 메인 (TSK-324)", id:"D04", q:"줄 모양을 섞어 쓸까요? 고를 값이 있는 줄은 토글을 빼고 오른쪽 값과 화살표, 켜고 끄기만 있는 줄은 토글만", rec:"예", why:"지금은 토글과 값이 같은 상태를 두 번 보여 주고 누를 곳이 두 군데예요. 알람 편집 줄도 같은 규칙으로 바꿔요. 끄기는 시트에서 '안 함'.", link:"https://claude.ai/artifact/Sy2udVCfEk72oZpcRpLdsz", lt:"다시 설명: 지금과 섞어 쓰기 나란히 보기"},
  {g:"설정 메인 (TSK-324)", id:"D20", q:"아이콘 빼고 구분선, 줄 높이 52로 고친 설정 메인 시안을 확정할까요?", rec:"예", why:"D01~D03 답대로 고쳤어요. 카드 안 첫 글이 위에서 20이라 알람 울림 최적화 카드와 같고, 내용이 하단 메뉴 위에 다 들어가요.", link:"https://www.figma.com/design/MazZLYfaQndMh9AxlRcz2v?node-id=1387-11297", lt:"고친 설정 메인"},
  {g:"설정 하위 (TSK-317)", id:"D05", q:"설정 하위 2차를 확정하고, 규칙과 어긋난 곳 7가지를 추천대로 고칠까요?", rec:"예", why:"방해 금지 이름 하나로, FAQ 버튼 이름, FAQ 번호 원, 오픈소스와 P6의 옛 이름 '모닝업', P5의 '날씨 테마' 이름 등이에요. 갤럭시 메뉴 이름은 폰 확인 뒤에 맞춰요.", link:"https://www.figma.com/design/MazZLYfaQndMh9AxlRcz2v?node-id=1366-10777", lt:"2차 구역"},
  {g:"권한 시트 (TSK-322)", id:"D06", q:"설명을 뺀 권한 줄이 촘촘해 보이면 줄 높이를 44로 올릴까요?", rec:"지금(사이 12) 그대로 보고 좁으면 올려요", why:"아코디언 규칙 그대로예요.", link:"https://www.figma.com/design/MazZLYfaQndMh9AxlRcz2v?node-id=1385-11160", lt:"권한 시트 시안"},
  {g:"권한 시트 (TSK-322)", id:"D07", q:"Z플립5에서 갤럭시 메뉴 이름을 보기만 해서 확인할까요? (폰 작업)", rec:"예", why:"'전체 화면 알림 허용', '권한 허용' 같은 글자가 지금은 추정이에요. 설정은 바꾸지 않고 화면만 봐요."},
  {g:"푸시 모음 (TSK-318)", id:"D08", q:"미션 포기 '조금 달라요' 내용을 알림에도 보여 줄까요?", rec:"아니오, 지금대로 빼요", why:"다시 설명: 넣으면 틀릴 때 잠금 화면 알림 글이 잠깐 '조금 달라요'로 바뀌어요. 하지만 글은 M5 화면에서 치고 있어서 알림을 볼 일이 거의 없고, 글이 바뀔 때마다 알림이 다시 떠서 진동이나 깜빡임이 생길 수 있어요. 빼면 일이 없고 틀린 건 M5 화면에서 바로 보여요."},
  {g:"푸시 모음 (TSK-318)", id:"D09", q:"확정 푸시 모음의 옛 W2-1 두 칸(옛 이름 '모닝업')을 새 칸으로 바꿀까요?", rec:"예", why:"앱 이름이 '일어나'로 바뀌어서 옛 칸은 틀린 그림이에요."},
  {g:"푸시 모음 (TSK-318)", id:"D10", q:"쉬기 토스트는 지금 Snackbar 부품 시안 그대로 둘까요?", rec:"예", why:"부품 규칙과 이미 맞아요."},
  {g:"푸시 모음 (TSK-315)", id:"D11", q:"새 푸시 알림 4종 시안을 확정할까요?", rec:"예", why:"결정 필요 구역에서 확정 구역으로 옮겨요."},
  {g:"예전 메모", id:"D12", q:"EX5-b 시트 높이를 EX5-a에 맞출까요?", rec:"예", why:"같은 종류 시트라 높이가 같아야 덜 흔들려 보여요."},
  {g:"예전 메모", id:"D13", q:"홈 접근성 안내 띠를 더 그릴까요?", rec:"보류", why:"권한 안내 흐름(TSK-322)이 정해진 뒤 같이 보면 좋아요."},
  {g:"예전 메모", id:"D14", q:"바텀시트 규칙과 부딪히는 화면 6가지를 정할까요?", rec:"아래 D22~D26으로 나눴어요", why:"다시 설명: 바텀시트 규칙(헤더는 제목만, 시트 안 스위치 금지, 고르는 값은 라디오나 카운터)을 시트 10장에 넣었는데, 5곳이 규칙과 부딪혀 그대로 뒀어요. 한 곳씩 D22~D26에서 골라 주세요. 나중용 권한 시트 4장과 다크, 옛 복사본은 손대지 않아요."},
  {g:"바텀시트 규칙 예외 (D14 다시 설명)", id:"D22", q:"T3-4 미션 포기 안내 시트는 헤더 아래 보조 글을 본문처럼 써도 될까요? (규칙은 헤더에 제목만)", rec:"예, 예외로 둬요", why:"확인만 받는 시트라 본문이 그 한 줄뿐이에요. 따로 본문 칸을 만들면 높이만 커져요.", link:"https://www.figma.com/design/MazZLYfaQndMh9AxlRcz2v?node-id=1231-22435", lt:"T3-4"},
  {g:"바텀시트 규칙 예외 (D14 다시 설명)", id:"D23", q:"O4-1a 첫 실행 알림 권한 창은 지금처럼 가운데 정렬 창과 움직임을 둘까요?", rec:"예, 예외로 둬요", why:"첫 실행에서 한 번만 보는 안내 창이라 일반 시트 규칙과 따로 가요.", link:"https://www.figma.com/design/MazZLYfaQndMh9AxlRcz2v?node-id=1218-22300", lt:"O4-1a"},
  {g:"바텀시트 규칙 예외 (D14 다시 설명)", id:"D24", q:"S3 다시 울림 시트의 간격, 횟수 칩을 미루기처럼 카운터로 바꿀까요? '무제한'은 횟수 카운터의 맨 끝 값으로", rec:"예", why:"미루기 시트가 카운터로 바뀌어서(결정 215) 비슷한 시트끼리 모양을 맞춰요.", link:"https://www.figma.com/design/MazZLYfaQndMh9AxlRcz2v?node-id=461-7911", lt:"S3"},
  {g:"바텀시트 규칙 예외 (D14 다시 설명)", id:"D25", q:"S6 볼륨 시트는 슬라이더를 그대로 두고, 시트 안 진동 스위치만 빼서 알람 편집의 따로 된 줄로 옮길까요?", rec:"예", why:"볼륨은 슬라이더가 가장 쉬워요. 시트 안 스위치는 금지 규칙이라 진동만 밖으로 빼요.", link:"https://www.figma.com/design/MazZLYfaQndMh9AxlRcz2v?node-id=509-202", lt:"S6"},
  {g:"바텀시트 규칙 예외 (D14 다시 설명)", id:"D26", q:"T1-1, T1-2 '깼는지 묻기' 시트는 지금 칩 모양 그대로 둘까요?", rec:"보류", why:"이 기능을 계속 쓸지부터 정해야 해요. 쓰기로 하면 그때 라디오 목록으로 맞춰요.", link:"https://www.figma.com/design/MazZLYfaQndMh9AxlRcz2v?node-id=1048-13080", lt:"T1-1"},
  {g:"알람 편집 (TSK-319)", id:"D27", q:"결정 212~218을 넣은 알람 편집 시안(구독 전, 구독 뒤, 미루기 시트, 좀비모드 시트)을 확정할까요? Crazy Mode 제목 글자는 나중에 직접 하시는 것으로 빼고요", rec:"예", why:"캐치미 레벨 1~10(처음 레벨 1), 좀비모드 1~99번(처음 1번), 미루기 카운터, 1.5 그라데이션 테두리까지 다 반영됐어요. 확정해야 개발로 넘길 수 있어요.", link:"https://www.figma.com/design/MazZLYfaQndMh9AxlRcz2v?node-id=1380-10827", lt:"알람 편집 시안"},
  {g:"설정 하위 (TSK-317)", id:"D28", q:"작업 중 구역에 남은 옛 T2 알람 울림 최적화 원본을 보관 구역으로 옮길까요?", rec:"예", why:"새 T2 다섯 장이 확정 구역에 들어갔어요. 옛 원본은 지우지 않고 보관으로만 옮겨요.", link:"https://www.figma.com/design/MazZLYfaQndMh9AxlRcz2v?node-id=1237-22246", lt:"옛 T2"},
  {g:"권한 시트 (TSK-322)", id:"D21", q:"Z플립5 메뉴 이름에 맞춰 고친 권한 중간 시트 세 장을 확정할까요?", rec:"예", why:"폰에서 본 글자로 고쳤어요. 전체 화면 알림은 '권한 허용'을 켜고, 다른 앱 위에 표시는 목록에서 '일어나'를 켜요. 줄 높이는 24 그대로라 오늘 줄인 간격이 유지돼요.", link:"https://www.figma.com/design/MazZLYfaQndMh9AxlRcz2v?node-id=1385-11160", lt:"권한 시트"},
  {g:"구독 소개 러프 (TSK-325)", id:"D15", q:"이 구성(제목, 한 줄 소개, 기능 카드 2장, 아래 고정 버튼)으로 갈까요?", rec:"예", why:"월 구독 하나라 고를 것이 없고, 기능 카드 두 장이 화면의 주인공이에요.", link:"https://www.figma.com/design/MazZLYfaQndMh9AxlRcz2v?node-id=1392-11412", lt:"구독 소개 러프"},
  {g:"구독 소개 러프 (TSK-325)", id:"D16", q:"한 줄 소개 문구를 '초강력 잠깨우기'로 할까요?", rec:"예", why:"설정 카드 부제와 같은 말이라 처음 보는 사람도 이어서 읽혀요."},
  {g:"구독 소개 러프 (TSK-325)", id:"D17", q:"체험 일정 3단(오늘, 끝나기 전 알림, 결제 시작)은 빼고 작은 글 두 줄로 둘까요?", rec:"예, 빼요", why:"일정 칸이 들어가면 기능 카드가 아래로 밀려요. 결제 안내는 작은 글로도 충분해요."},
  {g:"구독 소개 러프 (TSK-325)", id:"D18", q:"알람 편집에서 들어오면 누른 기능 카드를 맨 위로 올릴까요?", rec:"예", why:"캐치미를 눌러 들어온 사람은 캐치미 설명부터 보고 싶어 해요."},
  {g:"구독 소개 러프 (TSK-325)", id:"D19", q:"기능 카드 그림 자리에 짧은 움직이는 그림을 넣을까요? (캐치미: 도망가는 버튼, 좀비모드: 다시 울리는 알람)", rec:"예", why:"두 기능 모두 글보다 움직임으로 보여 줘야 바로 이해돼요."}
];
// 짧은 제목: 접힌 줄에 보여요. 새 항목은 ITEMS에 t(짧은 제목)와 d(올린 날, 예 "11-29")를 넣어요.
const SHORT = {D01:"설정 줄 앞 아이콘 빼기",D02:"구분선 넣고 줄 높이 52",D03:"설정 메인 글자 14 유지",D04:"줄 모양 섞어 쓰기",D20:"설정 메인 시안 확정",D05:"설정 하위 2차 확정, 7곳 고침",D06:"권한 줄 높이 44로 올리기",D07:"Z플립5 메뉴 이름 보기만 확인",D08:"'조금 달라요' 알림에 보여 주기",D09:"옛 W2-1 두 칸을 새 칸으로",D10:"쉬기 토스트 시안 그대로",D11:"새 푸시 알림 4종 확정",D12:"EX5-b 높이를 EX5-a에 맞춤",D13:"홈 접근성 안내 띠 더 그리기",D14:"바텀시트 규칙 충돌 6곳",D22:"T3-4 보조 글 예외",D23:"O4-1a 가운데 창 예외",D24:"S3 다시 울림을 카운터로",D25:"S6 진동을 시트 밖으로",D26:"T1-1, T1-2 칩 그대로",D27:"알람 편집 시안 확정",D28:"옛 T2 원본 보관",D21:"권한 중간 시트 세 장 확정",D15:"구독 소개 구성",D16:"한 줄 소개 '초강력 잠깨우기'",D17:"체험 일정 3단 빼기",D18:"누른 기능 카드를 맨 위로",D19:"기능 카드에 움직이는 그림",D29:"확정 / 7 설정 탭: 헤더, 타입 5 교체",D30:"확정 / 3 알람 편집: 카운터 시트 9장",D31:"T6 자주 묻는 질문",D32:"P5, P6, 다음 알람 항상 표시",D33:"가운데 팝업 폭 312",D34:"홈 권한 띠: 빨간 아이콘",D35:"홈 알람 카드 스위치 아이콘",D36:"Bottom Sheet Guide 옮김",D37:"부품 점검 정리",D38:"화면 밖 설명 글 181개 지움",D39:"설정 설명 움직임 10가지",D40:"Setting Row에 Badge 속성",D41:"Sheet Header 원본 12/76",D42:"'확인 필요' 구역 보관",D43:"11-27 모음 30장 보관",D44:"오늘 모음의 옛 T2 복제 빼기",D45:"레퍼런스 보드 캡션 지우기",D46:"판 안 이름표 지우기"};
const DEFAULT_DAY = "11-28";
const dayOf = it => it.d || DEFAULT_DAY;
const titleOf = it => it.t || SHORT[it.id] || it.q;
const LABELS = {yes:"예", no:"아니오", hold:"보류", ask:"다시 설명"};
const TABS = [["left","남은 것"],["done","답한 것"],["all","전체"]];
const state = {}; const open = new Set();
let db = null, filter = "left", day = "all";
try{ filter = localStorage.getItem("dfilter") || "left"; day = localStorage.getItem("dday") || "all"; }catch(e){}

function esc(s){return String(s).replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]))}
const chosen = it => (state[it.id]||{}).choice;
const ansDay = a => { if(!a || !a.at) return ""; const t=new Date(a.at); return isNaN(t)?"":String(t.getMonth()+1).padStart(2,"0")+"-"+String(t.getDate()).padStart(2,"0"); };
const CHEV = '<svg class="chev" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m6 9 6 6 6-6"/></svg>';
const rightHTML = it => { const a=state[it.id]||{}; return `<span class="date">${dayOf(it)}</span>` + (a.choice ? `<span class="chip ${a.choice}">${LABELS[a.choice]}</span>` : `<span class="rec">추천 <b>${esc(it.rec)}</b></span>`) + CHEV; };

function rowHTML(it){
  const a = state[it.id]||{}; const isOpen = open.has(it.id); const ad = ansDay(a);
  return `<article class="q${isOpen?" open":""}" data-id="${it.id}">
    <div class="row" tabindex="0" role="button" aria-expanded="${isOpen}">
      <span class="num">${it.id}</span>
      <span class="t">${esc(titleOf(it))}${a.note?'<span class="memo">메모</span>':""}</span>
      <span class="right">${rightHTML(it)}</span>
    </div>
    <div class="detail"${isOpen?"":" hidden"}>
      <p class="qt">${esc(it.q)}</p>
      <p class="why">추천 <b>${esc(it.rec)}</b>. ${esc(it.why)}${it.link?` <a href="${it.link}" target="_blank" rel="noopener">${esc(it.lt)} 열기</a>`:""}</p>
      <p class="why">올린 날 ${dayOf(it)}${ad?`, 답한 날 ${ad}`:""}</p>
      <div class="choices" role="group" aria-label="${it.id} 답">
        ${Object.entries(LABELS).map(([v,l])=>`<button type="button" data-v="${v}" aria-pressed="${a.choice===v}">${l}</button>`).join("")}
      </div>
      <textarea id="note-${it.id}" placeholder="피드백이나 이유 (선택)" aria-label="${it.id} 메모">${esc(a.note||"")}</textarea>
    </div>
  </article>`;
}
function inDay(it){ return day==="all" || dayOf(it)===day; }
function render(){
  const list = document.getElementById("list");
  const pass = it => inDay(it) && (filter==="all" || (filter==="left" ? !chosen(it) : !!chosen(it)));
  const groups = [];
  ITEMS.forEach(it=>{ let g = groups.find(x=>x.g===it.g); if(!g){g={g:it.g,items:[]};groups.push(g);} g.items.push(it); });
  let html = "";
  groups.forEach(g=>{
    const shown = g.items.filter(pass); if(!shown.length) return;
    const left = g.items.filter(it=>!chosen(it)).length;
    html += `<section class="group"><h2>${esc(g.g)} <small>남은 ${left} / ${g.items.length}</small></h2><div class="box">${shown.map(rowHTML).join("")}</div></section>`;
  });
  list.innerHTML = html || `<p class="empty">${filter==="left"?"이 조건에 남은 결정이 없어요.":filter==="done"?"이 조건에 답한 것이 없어요.":"이 날 올린 것이 없어요."}</p>`;
  summary();
}
function summary(){
  const pool = ITEMS.filter(inDay);
  const c={yes:0,no:0,hold:0,ask:0}; let left=0;
  pool.forEach(it=>{const ch=chosen(it); if(ch) c[ch]++; else left++;});
  const n = {left, done:pool.length-left, all:pool.length};
  document.getElementById("tabs").innerHTML = TABS.map(([k,l])=>`<button type="button" data-f="${k}" aria-pressed="${filter===k}">${l} ${n[k]}</button>`).join("");
  const days = [...new Set(ITEMS.map(dayOf))].sort().reverse();
  if(day!=="all" && !days.includes(day)) day="all";
  document.getElementById("dates").innerHTML = `<span class="lab">올린 날</span>` + [["all","모든 날"],...days.map(x=>[x,x])].map(([k,l])=>`<button type="button" data-d="${k}" aria-pressed="${day===k}">${l}</button>`).join("");
  document.getElementById("counts").textContent = `답한 것: 예 ${c.yes}, 아니오 ${c.no}, 보류 ${c.hold}, 다시 설명 ${c.ask}`;
}
async function save(id){
  const a = state[id]||{}; const st=document.getElementById("status");
  if(!db){st.textContent="저장소에 연결되지 않아 이 화면에서만 바뀌었어요."; return;}
  const at = new Date().toISOString(); state[id].at = at;
  try{ await db.doc("answers/"+id).set({choice:a.choice||"", note:a.note||"", at}); st.textContent="저장했어요."; }
  catch(e){ st.textContent="저장하지 못했어요. 잠시 뒤 다시 눌러 주세요."; }
}
function toggle(card){
  const id=card.dataset.id; const d=card.querySelector(".detail"); const r=card.querySelector(".row");
  if(open.has(id)){open.delete(id);d.hidden=true;card.classList.remove("open");r.setAttribute("aria-expanded","false");}
  else{open.add(id);d.hidden=false;card.classList.add("open");r.setAttribute("aria-expanded","true");}
}
document.querySelector(".filters").addEventListener("click",e=>{
  const f=e.target.closest("button[data-f]"), d=e.target.closest("button[data-d]");
  if(f){filter=f.dataset.f; try{localStorage.setItem("dfilter",filter);}catch(err){}}
  else if(d){day=d.dataset.d; try{localStorage.setItem("dday",day);}catch(err){}}
  else return;
  render();
});
const list=document.getElementById("list");
list.addEventListener("click",e=>{
  const b=e.target.closest("button[data-v]");
  if(b){
    const card=b.closest(".q"); const id=card.dataset.id; const v=b.dataset.v;
    state[id]=Object.assign({},state[id]); state[id].choice = state[id].choice===v ? "" : v;
    card.querySelectorAll("button[data-v]").forEach(x=>x.setAttribute("aria-pressed",String(state[id].choice===x.dataset.v)));
    card.querySelector(".right").innerHTML = rightHTML(ITEMS.find(x=>x.id===id));
    summary(); save(id); return;
  }
  const row=e.target.closest(".row"); if(row) toggle(row.closest(".q"));
});
list.addEventListener("keydown",e=>{ const row=e.target.closest(".row"); if(row && e.target===row && (e.key==="Enter"||e.key===" ")){e.preventDefault();toggle(row.closest(".q"));} });
const timers={};
list.addEventListener("input",e=>{
  const t=e.target.closest("textarea"); if(!t) return;
  const card=t.closest(".q"); const id=card.dataset.id; state[id]=Object.assign({},state[id],{note:t.value});
  const memo=card.querySelector(".t .memo"); if(t.value && !memo) card.querySelector(".t").insertAdjacentHTML("beforeend",'<span class="memo">메모</span>'); else if(!t.value && memo) memo.remove();
  clearTimeout(timers[id]); timers[id]=setTimeout(()=>save(id),700);
});
render();
(async()=>{
  const st=document.getElementById("status");
  const timer=setTimeout(()=>{st.textContent="저장소 응답이 늦어요. 골라 두면 연결되는 대로 저장해요.";},10000);
  try{
    db = await window.claude?.use?.("db");
    if(!db){clearTimeout(timer); st.textContent="저장소를 쓸 수 없는 화면이에요. 고른 답은 이 화면에만 남아요."; return;}
    let first=true;
    db.collection("answers").onSnapshot(snap=>{
      clearTimeout(timer);
      snap.docs.forEach(d=>{const x=d.data()||{}; state[d.id]={choice:x.choice||"", note:x.note||"", at:x.at||""};});
      const active=document.activeElement;
      if(first || !(active && active.tagName==="TEXTAREA")) render(); else summary();
      first=false;
      st.textContent="저장소에 연결됐어요. 고르면 바로 저장돼요.";
    },()=>{clearTimeout(timer); st.textContent="저장소를 읽지 못했어요. 새로 고쳐 주세요.";});
  }catch(e){clearTimeout(timer); st.textContent="저장소를 쓸 수 없는 화면이에요.";}
})();
</script>
