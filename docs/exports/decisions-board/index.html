<title>일어나 결정함</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;700&display=swap">
<style>
/* 한 줄 목록: 질문 카드가 위에서 아래로, 카드마다 네 가지 답 버튼과 메모 */
:root{
  --bg:#F3F5F9; --card:#FFFFFF; --fg:#14202E; --muted:#556274; --line:#DDE3EC;
  --accent:#2F6BFF; --accent-soft:#E6EEFF;
  --yes:#1E8E5A; --yes-soft:#E2F4EA; --no:#C2412D; --no-soft:#FBE7E3;
  --hold:#8A6A12; --hold-soft:#F8EFD6; --ask:#5B4BC4; --ask-soft:#ECE9FB;
  --font:"Noto Sans KR",system-ui,-apple-system,"Malgun Gothic",sans-serif;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0F141B; --card:#171E28; --fg:#EEF2F8; --muted:#A3AEBE; --line:#29323F;
  --accent:#6E98FF; --accent-soft:#1D2A47;
  --yes:#5CCB94; --yes-soft:#16322A; --no:#F08B78; --no-soft:#3A1F1B;
  --hold:#E3C266; --hold-soft:#352D16; --ask:#A99BFF; --ask-soft:#26223F; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0F141B; --card:#171E28; --fg:#EEF2F8; --muted:#A3AEBE; --line:#29323F;
  --accent:#6E98FF; --accent-soft:#1D2A47;
  --yes:#5CCB94; --yes-soft:#16322A; --no:#F08B78; --no-soft:#3A1F1B;
  --hold:#E3C266; --hold-soft:#352D16; --ask:#A99BFF; --ask-soft:#26223F; color-scheme:dark}
body{background:var(--bg);color:var(--fg);font-family:var(--font);line-height:1.55}
.wrap{max-width:760px;margin:0 auto;padding-block:28px 64px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));display:flex;flex-direction:column;gap:20px}
h1{font-size:24px;margin:0;text-wrap:balance}
.sub{color:var(--muted);margin:4px 0 0;font-size:14px}
.summary{display:flex;flex-wrap:wrap;gap:8px}
.pill{font-size:13px;padding:4px 10px;border-radius:999px;background:var(--card);border:1px solid var(--line);font-variant-numeric:tabular-nums}
.pill b{font-weight:700}
.status{font-size:13px;color:var(--muted)}
.group{display:flex;flex-direction:column;gap:10px}
.group h2{font-size:13px;letter-spacing:.04em;color:var(--muted);margin:8px 0 0;font-weight:700}
.q{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:16px;display:flex;flex-direction:column;gap:10px}
.q.done{border-color:transparent;box-shadow:inset 0 0 0 1.5px var(--line)}
.qhead{display:flex;gap:10px;align-items:baseline}
.num{font-size:12px;color:var(--muted);font-variant-numeric:tabular-nums;min-width:28px}
.qt{font-size:16px;font-weight:700;margin:0;min-width:0}
.rec{font-size:14px;margin:0;padding-left:38px}
.rec span{color:var(--accent);font-weight:700}
.why{font-size:13px;color:var(--muted);margin:0;padding-left:38px}
.why a{color:var(--accent)}
.choices{display:flex;flex-wrap:wrap;gap:8px;padding-left:38px}
.choices button{font:inherit;font-size:14px;padding:7px 14px;border-radius:10px;border:1px solid var(--line);background:transparent;color:var(--fg);cursor:pointer}
.choices button:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.choices button[aria-pressed="true"][data-v="yes"]{background:var(--yes-soft);color:var(--yes);border-color:transparent;font-weight:700}
.choices button[aria-pressed="true"][data-v="no"]{background:var(--no-soft);color:var(--no);border-color:transparent;font-weight:700}
.choices button[aria-pressed="true"][data-v="hold"]{background:var(--hold-soft);color:var(--hold);border-color:transparent;font-weight:700}
.choices button[aria-pressed="true"][data-v="ask"]{background:var(--ask-soft);color:var(--ask);border-color:transparent;font-weight:700}
.note{padding-left:38px}
.note textarea{width:100%;box-sizing:border-box;font:inherit;font-size:14px;color:var(--fg);background:var(--bg);border:1px solid var(--line);border-radius:10px;padding:8px 10px;min-height:40px;resize:vertical}
.note textarea:focus-visible{outline:2px solid var(--accent);outline-offset:1px}
@media (max-width:480px){.rec,.why,.choices,.note{padding-left:0}}
@media (prefers-reduced-motion:no-preference){.choices button{transition:background .15s}}
</style>

<div class="wrap">
  <header>
    <h1>일어나 결정함</h1>
    <p class="sub">고르면 바로 저장돼요. 메모 칸은 '아니오'나 '다시 설명'일 때 이유를 적어 주세요. Leader가 이 답을 읽고 방에 넘겨요.</p>
  </header>
  <div class="summary" id="summary"></div>
  <div class="status" id="status">저장소에 연결하는 중이에요.</div>
  <main id="list"></main>
</div>

<script>
const ITEMS = [
  {g:"설정 메인 (TSK-324)", id:"D01", q:"설정 줄 앞 아이콘을 뺄까요?", rec:"빼요", why:"카드로 이미 묶여 있고 줄 이름이 짧아요. 하위 화면에도 아이콘이 없어 일관돼요.", link:"https://www.figma.com/design/MazZLYfaQndMh9AxlRcz2v?node-id=1387-11297", lt:"아이콘 뺀 시안"},
  {g:"설정 메인 (TSK-324)", id:"D02", q:"연한 구분선을 넣고 줄 높이를 44에서 52로 맞출까요?", rec:"예", why:"카드 안 줄이 5개라 선이 있어야 줄 단위가 보여요. 두 카드의 줄 사이(4와 0)도 0으로 맞춰요."},

  {g:"설정 메인 (TSK-324)", id:"D04", q:"줄 모양을 섞어 쓸까요? 고를 값이 있는 줄은 토글을 빼고 오른쪽 값과 화살표, 켜고 끄기만 있는 줄은 토글만", rec:"예", why:"지금은 토글과 값이 같은 상태를 두 번 보여 주고 누를 곳이 두 군데예요. 알람 편집 줄도 같은 규칙으로 바꿔요. 끄기는 시트에서 '안 함'.", link:"https://claude.ai/artifact/Sy2udVCfEk72oZpcRpLdsz", lt:"다시 설명: 지금과 섞어 쓰기 나란히 보기"},
  {g:"설정 메인 (TSK-324)", id:"D20", q:"아이콘 빼고 구분선, 줄 높이 52로 고친 설정 메인 시안을 확정할까요?", rec:"예", why:"D01~D03 답대로 고쳤어요. 카드 안 첫 글이 위에서 20이라 알람 울림 최적화 카드와 같고, 내용이 하단 메뉴 위에 다 들어가요.", link:"https://www.figma.com/design/MazZLYfaQndMh9AxlRcz2v?node-id=1387-11297", lt:"고친 설정 메인"},

  {g:"권한 시트 (TSK-322)", id:"D06", q:"설명을 뺀 권한 줄이 촘촘해 보이면 줄 높이를 44로 올릴까요?", rec:"지금(사이 12) 그대로 보고 좁으면 올려요", why:"아코디언 규칙 그대로예요.", link:"https://www.figma.com/design/MazZLYfaQndMh9AxlRcz2v?node-id=1385-11160", lt:"권한 시트 시안"},
  {g:"권한 시트 (TSK-322)", id:"D07", q:"Z플립5에서 갤럭시 메뉴 이름을 보기만 해서 확인할까요? (폰 작업)", rec:"예", why:"'전체 화면 알림 허용', '권한 허용' 같은 글자가 지금은 추정이에요. 설정은 바꾸지 않고 화면만 봐요."},
  {g:"푸시 모음 (TSK-318)", id:"D08", q:"미션 포기 '조금 달라요' 내용을 알림에도 보여 줄까요?", rec:"아니오, 지금대로 빼요", why:"다시 설명: 넣으면 틀릴 때 잠금 화면 알림 글이 잠깐 '조금 달라요'로 바뀌어요. 하지만 글은 M5 화면에서 치고 있어서 알림을 볼 일이 거의 없고, 글이 바뀔 때마다 알림이 다시 떠서 진동이나 깜빡임이 생길 수 있어요. 빼면 일이 없고 틀린 건 M5 화면에서 바로 보여요."},
  {g:"푸시 모음 (TSK-318)", id:"D09", q:"확정 푸시 모음의 옛 W2-1 두 칸(옛 이름 '모닝업')을 새 칸으로 바꿀까요?", rec:"예", why:"앱 이름이 '일어나'로 바뀌어서 옛 칸은 틀린 그림이에요."},
  {g:"푸시 모음 (TSK-318)", id:"D10", q:"쉬기 토스트는 지금 Snackbar 부품 시안 그대로 둘까요?", rec:"예", why:"부품 규칙과 이미 맞아요."},
  {g:"푸시 모음 (TSK-315)", id:"D11", q:"새 푸시 알림 4종 시안을 확정할까요?", rec:"예", why:"결정 필요 구역에서 확정 구역으로 옮겨요."},
  {g:"예전 메모", id:"D12", q:"EX5-b 시트 높이를 EX5-a에 맞출까요?", rec:"예", why:"같은 종류 시트라 높이가 같아야 덜 흔들려 보여요."},
  {g:"예전 메모", id:"D13", q:"홈 접근성 안내 띠를 더 그릴까요?", rec:"보류", why:"권한 안내 흐름(TSK-322)이 정해진 뒤 같이 보면 좋아요."},
  {g:"예전 메모", id:"D14", q:"바텀시트 규칙과 부딪히는 화면 6가지를 정할까요?", rec:"아래 D22~D26으로 나눴어요", why:"다시 설명: 바텀시트 규칙(헤더는 제목만, 시트 안 스위치 금지, 고르는 값은 라디오나 카운터)을 시트 10장에 넣었는데, 5곳이 규칙과 부딪혀 그대로 뒀어요. 한 곳씩 D22~D26에서 골라 주세요. 나중용 권한 시트 4장과 다크, 옛 복사본은 손대지 않아요."},
  {g:"바텀시트 규칙 예외 (D14 다시 설명)", id:"D22", q:"T3-4 미션 포기 안내 시트는 헤더 아래 보조 글을 본문처럼 써도 될까요? (규칙은 헤더에 제목만)", rec:"예, 예외로 둬요", why:"확인만 받는 시트라 본문이 그 한 줄뿐이에요. 따로 본문 칸을 만들면 높이만 커져요.", link:"https://www.figma.com/design/MazZLYfaQndMh9AxlRcz2v?node-id=1231-22435", lt:"T3-4"},
  {g:"바텀시트 규칙 예외 (D14 다시 설명)", id:"D23", q:"O4-1a 첫 실행 알림 권한 창은 지금처럼 가운데 정렬 창과 움직임을 둘까요?", rec:"예, 예외로 둬요", why:"첫 실행에서 한 번만 보는 안내 창이라 일반 시트 규칙과 따로 가요.", link:"https://www.figma.com/design/MazZLYfaQndMh9AxlRcz2v?node-id=1218-22300", lt:"O4-1a"},
  {g:"바텀시트 규칙 예외 (D14 다시 설명)", id:"D24", q:"S3 다시 울림 시트의 간격, 횟수 칩을 미루기처럼 카운터로 바꿀까요? '무제한'은 횟수 카운터의 맨 끝 값으로", rec:"예", why:"미루기 시트가 카운터로 바뀌어서(결정 215) 비슷한 시트끼리 모양을 맞춰요.", link:"https://www.figma.com/design/MazZLYfaQndMh9AxlRcz2v?node-id=461-7911", lt:"S3"},
  {g:"바텀시트 규칙 예외 (D14 다시 설명)", id:"D25", q:"S6 볼륨 시트는 슬라이더를 그대로 두고, 시트 안 진동 스위치만 빼서 알람 편집의 따로 된 줄로 옮길까요?", rec:"예", why:"볼륨은 슬라이더가 가장 쉬워요. 시트 안 스위치는 금지 규칙이라 진동만 밖으로 빼요.", link:"https://www.figma.com/design/MazZLYfaQndMh9AxlRcz2v?node-id=509-202", lt:"S6"},
  {g:"바텀시트 규칙 예외 (D14 다시 설명)", id:"D26", q:"T1-1, T1-2 '깼는지 묻기' 시트는 지금 칩 모양 그대로 둘까요?", rec:"보류", why:"이 기능을 계속 쓸지부터 정해야 해요. 쓰기로 하면 그때 라디오 목록으로 맞춰요.", link:"https://www.figma.com/design/MazZLYfaQndMh9AxlRcz2v?node-id=1048-13080", lt:"T1-1"},
  {g:"알람 편집 (TSK-319)", id:"D27", q:"결정 212~218을 넣은 알람 편집 시안(구독 전, 구독 뒤, 미루기 시트, 좀비모드 시트)을 확정할까요? Crazy Mode 제목 글자는 나중에 직접 하시는 것으로 빼고요", rec:"예", why:"캐치미 레벨 1~10(처음 레벨 1), 좀비모드 1~99번(처음 1번), 미루기 카운터, 1.5 그라데이션 테두리까지 다 반영됐어요. 확정해야 개발로 넘길 수 있어요.", link:"https://www.figma.com/design/MazZLYfaQndMh9AxlRcz2v?node-id=1380-10827", lt:"알람 편집 시안"},
  {g:"권한 시트 (TSK-322)", id:"D21", q:"Z플립5 메뉴 이름에 맞춰 고친 권한 중간 시트 세 장을 확정할까요?", rec:"예", why:"폰에서 본 글자로 고쳤어요. 전체 화면 알림은 '권한 허용'을 켜고, 다른 앱 위에 표시는 목록에서 '일어나'를 켜요. 줄 높이는 24 그대로라 오늘 줄인 간격이 유지돼요.", link:"https://www.figma.com/design/MazZLYfaQndMh9AxlRcz2v?node-id=1385-11160", lt:"권한 시트"},
  {g:"구독 소개 러프 (TSK-325)", id:"D15", q:"이 구성(제목, 한 줄 소개, 기능 카드 2장, 아래 고정 버튼)으로 갈까요?", rec:"예", why:"월 구독 하나라 고를 것이 없고, 기능 카드 두 장이 화면의 주인공이에요.", link:"https://www.figma.com/design/MazZLYfaQndMh9AxlRcz2v?node-id=1392-11412", lt:"구독 소개 러프"},
  {g:"구독 소개 러프 (TSK-325)", id:"D16", q:"한 줄 소개 문구를 '초강력 잠깨우기'로 할까요?", rec:"예", why:"설정 카드 부제와 같은 말이라 처음 보는 사람도 이어서 읽혀요."},
  {g:"구독 소개 러프 (TSK-325)", id:"D17", q:"체험 일정 3단(오늘, 끝나기 전 알림, 결제 시작)은 빼고 작은 글 두 줄로 둘까요?", rec:"예, 빼요", why:"일정 칸이 들어가면 기능 카드가 아래로 밀려요. 결제 안내는 작은 글로도 충분해요."},
  {g:"구독 소개 러프 (TSK-325)", id:"D18", q:"알람 편집에서 들어오면 누른 기능 카드를 맨 위로 올릴까요?", rec:"예", why:"캐치미를 눌러 들어온 사람은 캐치미 설명부터 보고 싶어 해요."},
  {g:"구독 소개 러프 (TSK-325)", id:"D19", q:"기능 카드 그림 자리에 짧은 움직이는 그림을 넣을까요? (캐치미: 도망가는 버튼, 좀비모드: 다시 울리는 알람)", rec:"예", why:"두 기능 모두 글보다 움직임으로 보여 줘야 바로 이해돼요."}
];
const LABELS = {yes:"예", no:"아니오", hold:"보류", ask:"다시 설명"};
const state = {};
let db = null;

function esc(s){return String(s).replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]))}

function render(){
  const list = document.getElementById("list");
  let html = "", lastG = null;
  ITEMS.forEach((it,i)=>{
    if(it.g!==lastG){ if(lastG!==null) html+="</section>"; html+=`<section class="group"><h2>${esc(it.g)}</h2>`; lastG=it.g; }
    const a = state[it.id]||{};
    html += `<article class="q${a.choice?" done":""}" data-id="${it.id}">
      <div class="qhead"><span class="num">${it.id}</span><p class="qt">${esc(it.q)}</p></div>
      <p class="rec">추천 <span>${esc(it.rec)}</span></p>
      <p class="why">${esc(it.why)}${it.link?` <a href="${it.link}" target="_blank" rel="noopener">${esc(it.lt)}</a>`:""}</p>
      <div class="choices" role="group" aria-label="${esc(it.id)} 답">
        ${Object.entries(LABELS).map(([v,l])=>`<button type="button" data-v="${v}" aria-pressed="${a.choice===v}">${l}</button>`).join("")}
      </div>
      <div class="note"><textarea id="note-${it.id}" placeholder="메모 (선택)" aria-label="${esc(it.id)} 메모">${esc(a.note||"")}</textarea></div>
    </article>`;
  });
  html += "</section>";
  list.innerHTML = html;
  summary();
}
function summary(){
  const c={yes:0,no:0,hold:0,ask:0}; let left=0;
  ITEMS.forEach(it=>{const ch=(state[it.id]||{}).choice; if(ch) c[ch]++; else left++;});
  document.getElementById("summary").innerHTML =
    `<span class="pill">남은 것 <b>${left}</b></span>`+Object.entries(LABELS).map(([v,l])=>`<span class="pill">${l} <b>${c[v]}</b></span>`).join("");
}
async function save(id){
  const a = state[id]||{};
  if(!db){document.getElementById("status").textContent="저장소에 연결되지 않아 이 화면에서만 바뀌었어요."; return;}
  try{ await db.doc("answers/"+id).set({choice:a.choice||"", note:a.note||"", at:new Date().toISOString()});
       document.getElementById("status").textContent="저장했어요."; }
  catch(e){ document.getElementById("status").textContent="저장하지 못했어요. 잠시 뒤 다시 눌러 주세요."; }
}
document.getElementById("list").addEventListener("click",e=>{
  const b=e.target.closest("button[data-v]"); if(!b) return;
  const id=b.closest(".q").dataset.id; const v=b.dataset.v;
  state[id]=Object.assign({},state[id]); state[id].choice = state[id].choice===v ? "" : v;
  const card=b.closest(".q"); card.querySelectorAll("button[data-v]").forEach(x=>x.setAttribute("aria-pressed",String(state[id].choice===x.dataset.v)));
  card.classList.toggle("done",!!state[id].choice); summary(); save(id);
});
const timers={};
document.getElementById("list").addEventListener("input",e=>{
  const t=e.target.closest("textarea"); if(!t) return;
  const id=t.closest(".q").dataset.id; state[id]=Object.assign({},state[id],{note:t.value});
  clearTimeout(timers[id]); timers[id]=setTimeout(()=>save(id),700);
});
render();
(async()=>{
  const st=document.getElementById("status");
  const timer=setTimeout(()=>{st.textContent="저장소 응답이 늦어요. 골라 두면 연결되는 대로 저장해요.";},10000);
  try{
    db = await window.claude?.use?.("db");
    if(!db){clearTimeout(timer); st.textContent="저장소를 쓸 수 없는 화면이에요. 고른 답은 이 화면에만 남아요."; return;}
    db.collection("answers").onSnapshot(snap=>{
      clearTimeout(timer);
      const active=document.activeElement;
      snap.docs.forEach(d=>{const x=d.data()||{}; state[d.id]={choice:x.choice||"", note:x.note||""};});
      if(!(active && active.tagName==="TEXTAREA")) render(); else summary();
      st.textContent="저장소에 연결됐어요. 고르면 바로 저장돼요.";
    },()=>{clearTimeout(timer); st.textContent="저장소를 읽지 못했어요. 새로 고쳐 주세요.";});
  }catch(e){clearTimeout(timer); st.textContent="저장소를 쓸 수 없는 화면이에요.";}
})();
</script>
