<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>모닝업 프로젝트 보드</title>
<style>
:root{
  --bg:#FFFFFF; --card:#FFFFFF; --raised:#F1F3F5; --sub:#F8F9FA; --line:#E3E6EA; --divider:#EEF0F2; --hover:#F4F5F7;
  --fg:#14181F; --body:#2C333D; --muted:#525B67; --faint:#626B77; --disabled:#BCC3CC;
  --key:#0B6CF0; --key-soft:#EEF5FF; --key-text:#0A5DD0;
  --sun:#F28A3C; --sun-soft:#FFF1E6; --sun-text:#B35410;
  --ok:#00C281; --ok-soft:#E7F7F0; --ok-text:#00875A;
  --err:#D2353A; --err-soft:#FDECEC; --err-text:#B3242A;
  --hold:#7C8AA5; --hold-soft:#EDF0F6;
  --sky:#0A78C2; --sky-soft:#E6F2FA; --sky-text:#08639F;
  --ask:#7A3FD1; --ask-soft:#F3EDFD; --ask-text:#6A2FC0;
  --shadow:none;
  --panel-shadow:-8px 0 24px rgba(20,24,31,.10);
  --f:"Pretendard","Apple SD Gothic Neo","Malgun Gothic","맑은 고딕",system-ui,sans-serif;
  --mono:ui-monospace,"Cascadia Mono","Consolas",monospace;
  --r1:4px; --r2:6px; --r3:6px;
  color-scheme:light;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0F1115; --card:#15181D; --raised:#1F2329; --sub:#13161A; --line:#262A31; --divider:#1D2026; --hover:#1A1D22;
  --fg:#ECEFF3; --body:#C9CFD7; --muted:#A7B0BB; --faint:#9099A4; --disabled:#4A515B;
  --key:#8AB8FB; --key-soft:#13305A; --key-text:#B9D4FD;
  --sun:#FFB067; --sun-soft:#3A2614; --sun-text:#FFB067;
  --ok:#00E09A; --ok-soft:#123528; --ok-text:#3EF0B5;
  --err:#FF6B6B; --err-soft:#3A1A1C; --err-text:#FF8A8A;
  --hold:#8E9BB3; --hold-soft:#1E2532;
  --sky:#5FB2E3; --sky-soft:#12283A; --sky-text:#8FCBF0;
  --ask:#B794F6; --ask-soft:#2A1F45; --ask-text:#CDB4FA;
  --shadow:none; --panel-shadow:-8px 0 24px rgba(0,0,0,.5); color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0F1115; --card:#15181D; --raised:#1F2329; --sub:#13161A; --line:#262A31; --divider:#1D2026; --hover:#1A1D22;
  --fg:#ECEFF3; --body:#C9CFD7; --muted:#A7B0BB; --faint:#9099A4; --disabled:#4A515B;
  --key:#8AB8FB; --key-soft:#13305A; --key-text:#B9D4FD;
  --sun:#FFB067; --sun-soft:#3A2614; --sun-text:#FFB067;
  --ok:#00E09A; --ok-soft:#123528; --ok-text:#3EF0B5;
  --err:#FF6B6B; --err-soft:#3A1A1C; --err-text:#FF8A8A;
  --hold:#8E9BB3; --hold-soft:#1E2532;
  --sky:#5FB2E3; --sky-soft:#12283A; --sky-text:#8FCBF0;
  --ask:#B794F6; --ask-soft:#2A1F45; --ask-text:#CDB4FA;
  --shadow:none; --panel-shadow:-8px 0 24px rgba(0,0,0,.5); color-scheme:dark}

*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%}
body{background:var(--bg);color:var(--body);font-family:var(--f);font-size:14px;line-height:1.55;word-break:keep-all;-webkit-font-smoothing:antialiased;overflow:hidden}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer}
input{font:inherit;color:inherit}
svg.i{width:16px;height:16px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round;flex:none}
svg.i.s{width:14px;height:14px}
.num{font-variant-numeric:tabular-nums}
.key{font-family:var(--mono);font-size:13px;color:var(--muted);letter-spacing:-.01em;white-space:nowrap}
:focus-visible{outline:2px solid var(--key);outline-offset:2px;border-radius:4px}

/* 틀 */
.app{display:grid;grid-template-rows:auto auto auto 1fr;grid-template-columns:minmax(0,1fr);height:100vh}
.top{display:flex;align-items:center;gap:12px;padding:12px 24px 0}
.top h1{font-size:16px;font-weight:700;color:var(--fg)}
.top .built{color:var(--faint);font-size:13px}
.top .sp{flex:1}
.ibtn{display:inline-flex;align-items:center;justify-content:center;width:28px;height:28px;border-radius:var(--r1);color:var(--muted);transition:background .15s}
.ibtn:hover{background:var(--raised);color:var(--fg)}

/* 요약: 한 줄 글자 */
.stats{display:flex;flex-wrap:wrap;align-items:center;gap:2px 14px;padding:6px 24px 0;font-size:13px;color:var(--muted)}
.stat{display:inline-flex;align-items:baseline;gap:5px;height:24px;padding:0 6px;margin:0 -6px;border-radius:var(--r1);color:var(--muted);white-space:nowrap;line-height:24px}
button.stat:hover{background:var(--hover);color:var(--fg)}
.stat b{font-size:14px;font-weight:600;color:var(--fg);font-variant-numeric:tabular-nums}
.stat.warn b{color:var(--err-text)}
.stat.ask b,.stat.ask{color:var(--ask-text)}
.stat[aria-pressed="true"]{background:var(--key-soft);color:var(--key-text)}
.stat-sep{width:1px;height:12px;background:var(--line)}

/* 탭과 필터 */
.bar{display:flex;align-items:center;gap:4px;flex-wrap:wrap;padding:10px 24px 8px;border-bottom:1px solid var(--line)}
.tabs{display:flex;gap:2px;margin-right:12px}
.tab{display:inline-flex;align-items:center;gap:6px;height:28px;padding:0 10px;border-radius:var(--r1);color:var(--muted);font-weight:500;transition:background .15s,color .15s}
.tab:hover{background:var(--hover);color:var(--fg)}
.tab[aria-selected="true"]{background:var(--raised);color:var(--fg);font-weight:600}
.tab .n{font-size:12px;color:var(--faint);font-weight:500}
.search{display:flex;align-items:center;gap:6px;height:28px;padding:0 8px;border-radius:var(--r1);background:var(--bg);border:1px solid var(--line);color:var(--faint);min-width:200px;margin-right:4px}
.search input{border:0;outline:0;background:none;width:100%;color:var(--fg)}
.search:focus-within{border-color:var(--key)}
.fbtn{display:inline-flex;align-items:center;gap:4px;height:28px;padding:0 8px;border-radius:var(--r1);color:var(--muted);transition:background .15s}
.fbtn:hover{background:var(--hover);color:var(--fg)}
.fbtn .dn{color:var(--faint)}
.fbtn.on{background:var(--key-soft);color:var(--key-text);font-weight:600}
.fbtn .x{display:inline-flex;margin-right:-4px;border-radius:4px;padding:2px}
.fbtn .x:hover{background:rgba(11,108,240,.15)}
.reset{height:28px;padding:0 8px;color:var(--key-text);font-weight:600;border-radius:var(--r1)}
.reset:hover{background:var(--key-soft)}
.count{margin-left:auto;color:var(--faint);font-size:13px}
.menu{position:fixed;z-index:40;min-width:220px;max-height:60vh;overflow:auto;padding:6px;background:var(--card);border:1px solid var(--line);border-radius:var(--r2);box-shadow:0 8px 24px rgba(20,24,31,.12)}
.menu label{display:flex;align-items:center;gap:8px;padding:6px 8px;border-radius:var(--r1);cursor:pointer;white-space:nowrap}
.menu label:hover{background:var(--hover)}
.menu input{accent-color:var(--key);width:15px;height:15px}
.menu .c{margin-left:auto;color:var(--faint);font-size:13px;padding-left:16px}
.menu .hd{padding:6px 8px 4px;font-size:12px;font-weight:600;color:var(--faint)}

/* 본문 */
.main{overflow:auto;position:relative}
.view{padding:16px 24px 40px}
.empty{padding:60px 0;text-align:center;color:var(--faint)}

/* 칩 */
.chip{display:inline-flex;align-items:center;gap:6px;font-size:13px;font-weight:500;color:var(--body);white-space:nowrap}
.chip::before{content:"";width:7px;height:7px;border-radius:50%;background:var(--c,currentColor);flex:none}
.chip.plain::before{display:none}
.s-todo{--c:var(--disabled)}
.s-doing{--c:var(--key)}
.s-review{--c:var(--sun)}
.s-waiting_user{--c:var(--ask)}
.chip.s-waiting_user{color:var(--ask-text);font-weight:600}
.s-done{--c:var(--ok)}
.s-hold{--c:var(--hold)}
.s-cancelled{--c:var(--disabled)}
.chip.s-cancelled,.chip.s-closed{color:var(--faint)}
.s-open{--c:var(--err)}
.s-reopened{--c:var(--err)}
.chip.s-reopened{color:var(--err-text);font-weight:600}
.s-resolved{--c:var(--ok)}
.s-closed{--c:var(--disabled)}
.sev{display:inline-flex;align-items:center;gap:4px;font-size:13px;font-weight:600;white-space:nowrap}
.sev-high{color:var(--err-text)} .sev-medium{color:var(--sun-text)} .sev-low{color:var(--faint)}
.area{display:inline-flex;align-items:center;height:18px;padding:0 5px;border-radius:var(--r1);background:var(--raised);color:var(--muted);font-size:12px;font-weight:500;white-space:nowrap}
.who{display:inline-flex;align-items:center;gap:4px;color:var(--muted);font-size:13px;white-space:nowrap}
.av{display:inline-flex;align-items:center;justify-content:center;width:18px;height:18px;border-radius:50%;background:var(--raised);color:var(--muted);font-size:12px;font-weight:700}
.av.me{background:var(--key-soft);color:var(--key-text)}
.lnk{color:var(--key-text);cursor:pointer}
.lnk:hover{text-decoration:underline}
.clickable{cursor:pointer}
.clickable:hover{filter:brightness(.96)}

/* 칸반 */
.kb{display:grid;grid-auto-flow:column;grid-auto-columns:minmax(260px,1fr);gap:12px;align-items:start;min-width:max-content}
.col{background:var(--sub);border-radius:var(--r2);padding:6px;min-width:260px}
.col.fold .cards{display:none}
.col[data-st="waiting_user"]{background:var(--ask-soft)}
.colh{display:flex;align-items:center;gap:8px;padding:4px 6px 8px;font-weight:600;color:var(--fg)}
.colh button.t{display:flex;align-items:center;gap:8px;border-radius:var(--r1);padding:2px 4px;margin:-2px -4px}
.colh button.t:hover{background:var(--hover)}
.colh .n{color:var(--faint);font-weight:500;font-variant-numeric:tabular-nums}
.colh .fold{margin-left:auto}
.cards{display:flex;flex-direction:column;gap:6px}
.card{display:block;width:100%;text-align:left;background:var(--card);border:1px solid var(--line);border-radius:var(--r2);padding:9px 11px;transition:border-color .15s}
.card:hover{border-color:var(--disabled)}
.card[aria-current="true"]{box-shadow:inset 0 0 0 2px var(--key)}
.card .r1{display:flex;align-items:center;gap:6px;margin-bottom:4px}
.card .r1 .sp{flex:1}
.card .tt{color:var(--fg);font-weight:500;line-height:1.45}
.card .r3{display:flex;align-items:center;gap:10px;margin-top:8px;color:var(--faint);font-size:13px}
.card .r3 .sp{flex:1}
.meta{display:inline-flex;align-items:center;gap:3px}
.late{color:var(--err-text);font-weight:600}
.more{width:100%;padding:8px;color:var(--muted);font-weight:600;border-radius:var(--r1)}
.more:hover{background:var(--hover)}

/* 표 */
table{border-collapse:separate;border-spacing:0;width:100%}
.tbl{border:1px solid var(--line);border-radius:var(--r2);overflow:hidden}
.tbl th{position:sticky;top:0;z-index:2;background:var(--bg);text-align:left;font-size:13px;font-weight:600;color:var(--faint);padding:10px 12px;border-bottom:1px solid var(--line);white-space:nowrap}
.tbl th button{display:inline-flex;align-items:center;gap:4px;font-weight:600;color:inherit}
.tbl th button:hover{color:var(--fg)}
.tbl th[aria-sort] button{color:var(--fg)}
.tbl td{padding:9px 12px;border-bottom:1px solid var(--divider);vertical-align:middle}
.tbl tr:last-child td{border-bottom:0}
.tbl tbody tr{cursor:pointer;transition:background .12s}
.tbl tbody tr:hover{background:var(--hover)}
.tbl tbody tr[aria-current="true"]{background:var(--key-soft)}
.tbl td.tt{color:var(--fg);font-weight:500;min-width:240px}
.tbl tr.grp td{background:var(--sub);font-weight:700;color:var(--fg);cursor:default;padding:8px 12px}
.tbl tr.again td:first-child{box-shadow:inset 3px 0 0 var(--err)}
.again-n{display:inline-flex;align-items:center;gap:3px;color:var(--err-text);font-weight:700}

/* 간트 */
.gt{position:relative;background:var(--bg);border:1px solid var(--line);border-radius:var(--r2);overflow:auto;max-height:calc(100vh - 260px)}
.gt .grid{display:grid;grid-template-columns:340px auto;min-width:max-content}
.gt .lh,.gt .dh{position:sticky;top:0;z-index:3;background:var(--bg);border-bottom:1px solid var(--line);height:48px}
.gt .lh{left:0;z-index:4;display:flex;align-items:flex-end;padding:0 12px 8px;font-size:13px;font-weight:600;color:var(--faint)}
.gt .dh{display:flex}
.gt .day{width:var(--dw);flex:none;display:flex;flex-direction:column;align-items:center;justify-content:flex-end;padding-bottom:6px;font-size:12px;color:var(--faint);border-left:1px solid transparent}
.gt .day.mon{border-left-color:var(--line)}
.gt .day.we{color:var(--disabled)}
.gt .day.td{color:var(--sun-text);font-weight:700}
.gt .day .m{font-size:12px;font-weight:600;color:var(--muted);height:16px}
.gt .lab{position:sticky;left:0;z-index:2;background:var(--bg);display:flex;align-items:center;gap:8px;height:32px;padding:0 12px;border-right:1px solid var(--line);border-bottom:1px solid var(--divider);overflow:hidden;white-space:nowrap;cursor:pointer}
.gt .lab:hover{background:var(--hover)}
.gt .lab .tt{overflow:hidden;text-overflow:ellipsis;color:var(--body)}
.gt .lab.g{font-weight:600;color:var(--fg);background:var(--sub)}
.gt .lab.g .tt{color:var(--fg)}
.gt .lane{position:relative;height:32px;border-bottom:1px solid var(--divider)}
.gt .lane.g{background:var(--sub)}
.gt .bar{position:absolute;top:8px;height:16px;border-radius:4px;cursor:pointer;transition:filter .12s}
.gt .bar:hover{filter:brightness(1.08)}
.gt .bar.g{top:13px;height:6px;border-radius:3px;background:var(--disabled);cursor:default}
.gt .ms{position:absolute;top:8px;width:16px;height:16px;transform:translateX(-8px) rotate(45deg) scale(.8);border-radius:3px;background:var(--sun);cursor:pointer}
.gt .bl{position:absolute;top:0;bottom:0;pointer-events:none}
.gt .bl.today{width:2px;background:var(--sun);opacity:.9;z-index:1}
.gt .bl.msl{width:0;border-left:1px dashed var(--sun);opacity:.6}
.gt .bl.we{background:var(--sub);opacity:.8}
.b-todo{background:var(--disabled)} .b-doing{background:var(--key)} .b-review{background:var(--sun)}
.b-waiting_user{background:var(--ask)} .b-done{background:var(--ok)} .b-hold{background:var(--hold);opacity:.5} .b-cancelled{background:var(--disabled);opacity:.4}
.legend{display:flex;gap:14px;flex-wrap:wrap;margin:0 0 10px;color:var(--muted);font-size:13px}
.legend i{display:inline-block;width:10px;height:10px;border-radius:3px;margin-right:5px;vertical-align:-1px}
.nodate{margin-top:14px;color:var(--muted)}
.nodate .lnk{margin-right:10px}

/* 활동 */
.feed{border:1px solid var(--line);border-radius:var(--r2);padding:4px 0}
.ev{display:grid;grid-template-columns:130px 96px 1fr;gap:12px;padding:8px 16px;border-bottom:1px solid var(--divider);align-items:baseline}
.ev:last-child{border-bottom:0}
.ev .at{color:var(--faint);font-size:13px}
.ev .by{color:var(--muted);font-weight:600;font-size:13px}

/* 상세 패널 */
.scrim{position:fixed;inset:0;background:rgba(11,15,22,.2);opacity:0;pointer-events:none;transition:opacity .2s;z-index:20}
.panel{position:fixed;top:0;right:0;bottom:0;width:min(560px,100vw);background:var(--card);box-shadow:var(--panel-shadow);transform:translateX(102%);transition:transform .22s cubic-bezier(.2,.8,.2,1);z-index:30;display:flex;flex-direction:column}
body.open .panel{transform:none}
body.open .scrim{opacity:1;pointer-events:auto}
.ph{display:flex;align-items:center;gap:8px;padding:14px 16px 0 24px}
.ph .sp{flex:1}
.pb{overflow:auto;padding:8px 24px 40px}
.pb h2{font-size:16px;line-height:1.4;color:var(--fg);font-weight:600;margin:6px 0 14px}
.props{display:grid;grid-template-columns:96px 1fr;gap:2px 12px;margin-bottom:18px}
.props dt{color:var(--faint);font-size:13px;padding:6px 0}
.props dd{padding:4px 0;min-height:30px;display:flex;align-items:center;gap:6px;flex-wrap:wrap;color:var(--body)}
.sec{border-top:1px solid var(--divider);padding:16px 0 4px}
.sec h3{display:flex;align-items:center;gap:6px;font-size:13px;font-weight:700;color:var(--muted);margin-bottom:10px}
.sec h3 .n{color:var(--faint);font-weight:500}
.prose{white-space:pre-wrap;color:var(--body)}
.blank{color:var(--faint)}
.acc{list-style:none;counter-reset:a}
.acc li{counter-increment:a;display:flex;gap:8px;padding:3px 0}
.acc li::before{content:counter(a);flex:none;width:18px;height:18px;border-radius:50%;background:var(--raised);color:var(--muted);font-size:12px;font-weight:700;display:flex;align-items:center;justify-content:center;margin-top:1px}
.chk{list-style:none}
.chk li{display:flex;gap:8px;padding:3px 0;align-items:flex-start}
.chk .bx{flex:none;width:16px;height:16px;border-radius:4px;border:1.5px solid var(--disabled);margin-top:2px;display:flex;align-items:center;justify-content:center}
.chk li.d .bx{background:var(--ok);border-color:var(--ok);color:#fff}
.chk li.d span{color:var(--faint);text-decoration:line-through}
.prog{height:4px;border-radius:2px;background:var(--raised);overflow:hidden;margin:-2px 0 10px}
.prog i{display:block;height:100%;background:var(--ok)}
.rel{display:flex;flex-direction:column;gap:2px}
.rel .h{font-size:12px;color:var(--faint);margin:6px 0 2px}
.rel button{display:flex;align-items:center;gap:8px;text-align:left;padding:5px 8px;margin:0 -8px;border-radius:var(--r1)}
.rel button:hover{background:var(--hover)}
.rel button .tt{color:var(--body);overflow:hidden;text-overflow:ellipsis;white-space:nowrap;flex:1}
.refs a,.refs span{display:block;font-family:var(--mono);font-size:13px;color:var(--muted);padding:2px 0}
.cm{display:flex;gap:10px;padding:6px 0}
.cm .body{flex:1}
.cm .hd{font-size:13px;color:var(--faint)}
.cm .hd b{color:var(--fg);font-weight:600;margin-right:6px}
.cm .tx{white-space:pre-wrap}
.cm.rej .tx{color:var(--err-text)}
.act{list-style:none;border-left:2px solid var(--divider);margin-left:6px;padding-left:14px}
.act li{position:relative;padding:4px 0;font-size:13px;color:var(--muted)}
.act li::before{content:"";position:absolute;left:-19px;top:10px;width:8px;height:8px;border-radius:50%;background:var(--disabled)}
.act b{color:var(--body);font-weight:600}
.act .at{color:var(--faint);margin-right:6px}
.cmd{display:flex;align-items:center;gap:8px;margin-top:6px;padding:8px 10px;border-radius:var(--r1);background:var(--raised);font-family:var(--mono);font-size:13px;color:var(--muted)}
.cmd code{flex:1;overflow:auto;white-space:nowrap}
.copy{display:inline-flex;align-items:center;gap:4px;font-family:var(--f);font-weight:600;color:var(--key-text);padding:2px 6px;border-radius:5px}
.copy:hover{background:var(--key-soft)}

/* 목록 보기 (11-23 시안 구성, 11-23 TSK-160 업무 도구 톤) */
[hidden]{display:none!important}
.lv{display:grid;grid-template-columns:minmax(0,1fr) 300px;gap:32px;align-items:start;max-width:1320px}
.lv-left{display:flex;flex-direction:column;gap:10px;min-width:0}
.lv-chips{display:flex;flex-wrap:wrap;gap:2px;margin-left:-2px}
.lv-chip{height:28px;padding:0 10px;border-radius:var(--r1);color:var(--muted);font-weight:500;transition:background .15s,color .15s}
.lv-chip:hover{background:var(--hover);color:var(--fg)}
.lv-chip[aria-pressed="true"]{background:var(--raised);color:var(--fg);font-weight:600}
.lv-chip .n{font-size:12px;font-weight:500;color:var(--faint);margin-left:5px}
.lv{--lvcols:8px 72px minmax(0,1fr) 64px 48px 84px}
.lv-head{display:grid;grid-template-columns:var(--lvcols);gap:10px;align-items:center;height:28px;padding:0 12px;border-top:1px solid var(--line);font-size:12px;font-weight:600;color:var(--faint)}
.lv-groups{border:1px solid var(--line);border-radius:var(--r2);overflow:hidden}
.lv-grp+.lv-grp{border-top:1px solid var(--line)}
.lv-grp>summary{list-style:none;display:flex;align-items:center;gap:8px;height:40px;padding:0 12px;background:var(--sub);cursor:pointer;user-select:none;transition:background .15s}
.lv-grp>summary::-webkit-details-marker{display:none}
.lv-grp>summary:hover{background:var(--hover)}

<script>
const D = /*__DATA__*/null;
const $ = s => document.querySelector(s);
const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const ic = (n, cls = "") => `<svg class="i ${cls}"><use href="#i-${n}"/></svg>`;
const L = D.labels, O = D.order, TODAY = D.today;
const TASKS = D.tasks.filter(t => t.parent), GROUPS = D.tasks.filter(t => !t.parent);
D.tasks.concat(D.issues).forEach(o => { if (o.owner === "Claude") o.owner = D.labels.area[o.area] || "운영"; });   // 옛 담당 Claude는 분야 이름으로 보임
const BY = {}; D.tasks.forEach(t => BY[t.id] = t); D.issues.forEach(i => BY[i.id] = i);
const isIss = id => String(id).startsWith("ISS-");
const CLOSED = new Set(["done", "cancelled"]), OPEN_I = new Set(["open", "doing", "reopened"]);
const md = d => d ? d.slice(5).replace("-", "-") : "";
const fmtD = d => d ? `${+d.slice(5,7)}/${+d.slice(8,10)}` : "";
const dnum = d => Math.round((new Date(d + "T00:00") - new Date(TODAY + "T00:00")) / 864e5);
const late = t => t.due && !CLOSED.has(t.status) && t.status !== "hold" && t.due < TODAY;
const role = n => { const m = /^\[(\S+) /.exec(n || ""); return m ? m[1] : (n || "").replace(" 방", ""); };
const dispName = n => { if (!n) return ""; const r = role(n) || n; return r === "Leader" ? "운영" : r; };   // 화면에는 분야 이름만, Leader는 운영 (데이터 owner 값은 그대로)
const revName = n => n && role(n) !== "Leader" ? dispName(n) : "";   // 검토자가 Leader면 보이지 않음

// 기간(마일스톤 구간)
const MS = TASKS.filter(t => t.milestone && t.due).sort((a, b) => a.due < b.due ? -1 : 1);
const PERIODS = [
  {k: "late", label: "지연", test: t => late(t)},
  {k: "week", label: "이번 주 마감", test: t => t.due && !CLOSED.has(t.status) && dnum(t.due) >= 0 && dnum(t.due) <= 6},
  ...MS.map((m, n) => ({k: "ms" + n, label: `~ ${m.title.split("(")[0].trim()} (${fmtD(m.due)})`,
    test: t => (t.due || t.start) && (t.due || t.start) <= m.due && (n === 0 || (t.due || t.start) > MS[n - 1].due)})),
  {k: "nodate", label: "날짜 없음", test: t => !t.start && !t.due},
];

// ---------- 상태 ----------
const TABS = [
  {k: "list", label: "목록", icon: "list"}, {k: "board", label: "칸반", icon: "kanban"},
  {k: "table", label: "표", icon: "table"},
  {k: "gantt", label: "간트", icon: "gantt"}, {k: "issues", label: "이슈", icon: "bug"},
  {k: "activity", label: "기록", icon: "history"},
];
const F_TASK = ["status", "area", "owner", "verify", "period"], F_ISS = ["istatus", "sev", "area", "owner"];
const FL = {status: "상태", istatus: "상태", area: "분야", owner: "담당", period: "기간", sev: "심각도", verify: "확인 방법"};
let S = {tab: "list", q: "", f: {}, open: null, cur: null, sort: {list: ["wbs", 1], issues: ["sev", 1]}, fold: {},
  lf: "open", lvg: new Set(GROUPS.filter(g => g.wbs === "3" || g.wbs === "4").map(g => g.id)), lvr: new Set()};

const LINK_RE = /^#?((?:TSK|ISS)-\d+)$/i;
const linkId = () => { const m = LINK_RE.exec(decodeURIComponent(location.hash)); return m ? m[1].toUpperCase() : null; };
function loadState() {
  try {
    const st = JSON.parse(localStorage.getItem("pm-board-state") || "null"); if (!st) return;
    S.q = st.q || ""; S.f = st.f || {}; if (st.lf) S.lf = st.lf;
  } catch (e) {}
}
function readHash() {   // 옛 주소(#tab=..&q=..)도 읽어 줌
  if (!location.hash.includes("=")) return;
  const h = new URLSearchParams(location.hash.slice(1));
  if (h.get("tab")) S.tab = h.get("tab");

  S.f = {};
  for (const k of Object.keys(FL)) if (h.get(k)) S.f[k] = h.get(k).split(",");

// ---------- 필터 ----------
function valOf(o, k) {
  if (k === "status" || k === "istatus") return [o.status];
  if (k === "area") return [o.area || ""];
  if (k === "owner") return [...new Set([dispName(o.owner) || "(없음)", ...(o.status === "review" && revName(o.reviewer) ? [revName(o.reviewer)] : [])])];
  if (k === "sev") return [o.severity];
  if (k === "verify") return [o.verify || "(없음)"];
  if (k === "period") return PERIODS.filter(p => p.test(o)).map(p => p.k);
  return [];
}
function text(o) {
  return [o.id, o.wbs, o.title, o.desc, o.owner, o.reviewer, o.cause, o.fix, o.repro, o.actual,
    ...(o.commits || []), ...(o.refs || []), ...(o.screens || []), ...(o.decisions || []),
    ...(o.comments || []).map(c => c.text)].join(" ").toLowerCase();
}
function pass(o, keys, skip) {
  if (S.q && !text(o).includes(S.q.toLowerCase())) return false;
  for (const k of keys) {
    if (k === skip) continue;
    const want = S.f[k];
    if (want && want.length && !valOf(o, k).some(v => want.includes(v))) return false;
  }
  return true;
}
const fTasks = () => TASKS.filter(t => pass(t, F_TASK));
const fIssues = () => D.issues.filter(i => pass(i, F_ISS));

function options(k) {
  const pool = k === "istatus" || k === "sev" || S.tab === "issues" ? D.issues : TASKS;
  const keys = S.tab === "issues" ? F_ISS : F_TASK;
  const base = pool.filter(o => pass(o, keys, k));
  const cnt = v => base.filter(o => valOf(o, k).includes(v)).length;
  if (k === "status") return O.task.map(v => [v, L.task[v], cnt(v)]);
  if (k === "istatus") return O.issue.map(v => [v, L.issue[v], cnt(v)]);
  if (k === "sev") return O.sev.map(v => [v, L.sev[v], cnt(v)]);
  if (k === "area") return O.area.map(v => [v, L.area[v], cnt(v)]).filter(x => x[2] || (S.f.area || []).includes(x[0]));
  if (k === "verify") return O.verify.map(v => [v, L.verify[v], cnt(v)]).filter(x => x[2] || (S.f.verify || []).includes(x[0]));
  if (k === "period") return PERIODS.map(p => [p.k, p.label, cnt(p.k)]);
  if (k === "owner") {
    const m = {};
    base.forEach(o => valOf(o, "owner").forEach(v => m[v] = (m[v] || 0) + 1));
    (S.f.owner || []).forEach(v => m[v] = m[v] || 0);
    const live = v => pool.some(o => valOf(o, "owner").includes(v) && !CLOSED.has(o.status) && o.status !== "closed");
    return Object.entries(m).sort((a, b) => (live(b[0]) - live(a[0])) || b[1] - a[1]).map(([v, c]) => [v, v, c]);
  }
}

// ---------- 간트 ----------
function viewGantt() {
  const ts = fTasks();
  const dated = ts.filter(t => t.start || t.due);
  if (!dated.length) return `<div class="empty">날짜가 있는 일이 없어요</div>`;
  const all = dated.flatMap(t => [t.start || t.due, t.due || t.start]).concat([TODAY]);
  const d0 = new Date(all.reduce((a, b) => a < b ? a : b) + "T00:00"), d1 = new Date(all.reduce((a, b) => a > b ? a : b) + "T00:00");
  d0.setDate(d0.getDate() - 1); d1.setDate(d1.getDate() + 3);
  const days = []; for (let d = new Date(d0); d <= d1; d.setDate(d.getDate() + 1)) days.push(new Date(d));
  const DW = days.length > 70 ? 22 : 28, W = days.length * DW;
  const iso = d => `${d.getFullYear()}-${String(d.getMonth() + 1).padStart(2, "0")}-${String(d.getDate()).padStart(2, "0")}`;
  const x = s => Math.round((new Date(s + "T00:00") - d0) / 864e5) * DW;
  const head = days.map((d, n) => `<div class="day ${d.getDay() === 1 ? "mon" : ""} ${d.getDay() % 6 === 0 ? "we" : ""} ${iso(d) === TODAY ? "td" : ""}"><span class="m">${d.getDate() === 1 || n === 0 ? (d.getMonth() + 1) + "월" : ""}</span>${d.getDate()}</div>`).join("");
  const wk = days.map((d, n) => d.getDay() % 6 === 0 ? `<div class="bl we" style="left:${n * DW}px;width:${DW}px"></div>` : "").join("");
  const lines = `${wk}<div class="bl today" style="left:${x(TODAY) + DW / 2}px" title="오늘"></div>` + MS.map(m => `<div class="bl msl" style="left:${x(m.due) + DW / 2}px"></div>`).join("");
  let rows = "";
  for (const g of GROUPS) {
    const kids = dated.filter(t => t.parent === g.id).sort((a, b) => ((a.start || a.due) < (b.start || b.due) ? -1 : 1));
    if (!kids.length) continue;
    const fold = S.fold["g" + g.id];
    const gs = kids.map(t => t.start || t.due).sort()[0], ge = kids.map(t => t.due || t.start).sort().pop();
    rows += `<div class="lab g" tabindex="0" role="button" aria-expanded="${!fold}" data-gfold="${g.id}">${ic(fold ? "chevr" : "chev", "s")}<span class="tt">${esc(L.area[g.area])}</span><span class="key">${kids.length}</span></div>
      <div class="lane g" style="width:${W}px">${lines}<div class="bar g" style="left:${x(gs)}px;width:${x(ge) - x(gs) + DW}px"></div></div>`;
    if (fold) continue;
    for (const t of kids) {
      const s = t.start || t.due, e = t.due || t.start;
      const bar = t.milestone ? `<div class="ms" data-open="${t.id}" style="left:${x(e) + DW / 2}px" title="${esc(t.title)}"></div>`
        : `<div class="bar b-${t.status}" data-open="${t.id}" style="left:${x(s) + 2}px;width:${x(e) - x(s) + DW - 4}px" title="${esc(t.id + " " + t.title)} (${fmtD(s)}~${fmtD(e)}, ${L.task[t.status]})"></div>`;
      rows += `<div class="lab" tabindex="0" role="button" data-open="${t.id}"><span class="key">${t.id}</span><span class="tt">${esc(t.title)}</span></div><div class="lane" style="width:${W}px">${lines}${bar}</div>`;
    }
  }
  const nod = ts.filter(t => !t.start && !t.due);
  return `<div class="legend">${O.task.map(s => `<span><i class="b-${s}"></i>${L.task[s]}</span>`).join("")}<span><i style="background:var(--sun);transform:rotate(45deg) scale(.8)"></i>마일스톤</span><span><i style="background:var(--sun);width:2px"></i>오늘</span></div>
    <div class="gt" id="gt" style="--dw:${DW}px"><div class="grid"><div class="lh">일</div><div class="dh">${head}</div>${rows}</div></div>
    ${nod.length ? `<div class="nodate">날짜 없음 ${nod.length}개: ${nod.map(t => `<span class="lnk key" data-open="${t.id}">${t.id}</span>`).join("")}</div>` : ""}`;
}

function evText(e) {
  if (e.id === "*") return esc(e.text || e.action);
  const ch = e.changes || {};
  if (e.action === "create") return `만듦 <b>${esc(ch.title ? ch.title[1] : "")}</b>`;
  const parts = [];
  for (const [k, [b, a]] of Object.entries(ch)) {
    if (k === "comments") parts.push(`댓글 "${esc((a || []).join(" / "))}"`);
    else if (k === "status") parts.push(`상태 ${esc(lab(e.id, b))} → <b>${esc(lab(e.id, a))}</b>`);
    else if (Array.isArray(a) || Array.isArray(b)) parts.push(k === "checklist" ? "체크리스트" : k);
    else parts.push(`${k} ${esc(b ?? "-")} → ${esc(a ?? "-")}`);
  }
  return parts.join(", ");
}

// ---------- 이벤트 ----------
document.addEventListener("click", e => {
  const t = e.target.closest("[data-lrow],[data-lf],[data-lgo],[data-lbar],[data-clear],[data-f],[data-tab],[data-open],[data-only],[data-stat],[data-sort],[data-fold],[data-more],[data-gfold],[data-copy],[data-link],#reset,#close,#theme,#scrim");
  if (!t) { if (!e.target.closest("#menu")) closeMenu(); return; }
  const d = t.dataset;
  if (d.clear) { e.stopPropagation(); closeMenu(); return setF(d.clear, []); }
  if (d.f) { const m = $("#menu"); if (!m.hidden && m.dataset.k === d.f) return closeMenu(); return openMenu(d.f, t); }
  closeMenu();
  if (d.lrow) { const li = t.closest(".lv-row"); return lvSet(li, !li.classList.contains("open")); }
  if (d.lf) { S.lf = d.lf; return render(); }
  if (d.lgo) { e.stopPropagation(); return lvGo(d.lgo); }
  if (d.lbar) return lvBar(d.lbar);
  if (d.tab) { S.tab = d.tab; for (const k of Object.keys(S.f)) if (!fields().includes(k)) delete S.f[k]; return render(); }
  if (d.link) {   // 클릭 안에서 바로 복사, 안 되면 글자를 골라 둠
    const url = linkOf(d.link), done = () => { t.classList.add("ok"); t.innerHTML = ic("check", "s") + "복사됨"; setTimeout(() => { t.classList.remove("ok"); t.innerHTML = ic("link", "s") + "링크 복사"; }, 1400); };
    const fail = () => { let box = t.parentNode.querySelector(".lv-linkbox");
      if (!box) { box = document.createElement("input"); box.className = "lv-linkbox"; box.readOnly = true; box.setAttribute("aria-label", "이 일 링크"); t.after(box); }
      box.value = url; box.focus(); box.select(); };
    try { navigator.clipboard.writeText(url).then(done, fail); } catch (err) { fail(); }
    return;
  }
  if (d.copy) { navigator.clipboard?.writeText(d.copy).then(() => { const old = t.innerHTML; t.innerHTML = ic("check", "s") + "복사됨"; setTimeout(() => t.innerHTML = old, 1200); }); return; }
  if (d.open) { e.stopPropagation(); S.open = d.open; return render(); }
  if (d.only) { const [k, v] = d.only.split(":"); return setF(k, S.f[k]?.length === 1 && S.f[k][0] === v ? [] : [v]); }
  if (d.stat) { const [k, v] = d.stat.split(":"); const tab = k === "istatus" ? "issues" : (S.tab === "issues" || S.tab === "activity") ? "board" : S.tab;
    if (tab !== S.tab) { S.tab = tab; S.f = {}; } return setF(k, S.f[k]?.length === 1 && S.f[k][0] === v ? [] : [v]); }
  if (d.sort) { const [kind, k] = d.sort.split(":"); const [sk, dir] = S.sort[kind]; S.sort[kind] = [k, sk === k ? -dir : 1]; return render(); }
  if (d.fold) { S.fold[d.fold] = !(S.fold[d.fold] ?? d.fold === "cancelled"); return render(); }
  if (d.more) { S.fold["more-" + d.more] = 1; return render(); }
  if (d.gfold) { S.fold["g" + d.gfold] = !S.fold["g" + d.gfold]; return render(); }
  if (t.id === "reset") { S.f = {}; S.q = ""; $("#q").value = ""; return render(); }
  if (t.id === "close" || t.id === "scrim") { S.open = null; return render(); }
  if (t.id === "theme") {
    const dark = document.documentElement.dataset.theme ? document.documentElement.dataset.theme === "dark" : matchMedia("(prefers-color-scheme: dark)").matches;
    document.documentElement.dataset.theme = dark ? "light" : "dark";
    try { localStorage.setItem("pm-theme", document.documentElement.dataset.theme); } catch (err) {}
    t.innerHTML = ic(dark ? "moon" : "sun");
  }
});
$("#menu").addEventListener("change", e => {
  const k = $("#menu").dataset.k;
  setF(k, [...$("#menu").querySelectorAll("input:checked")].map(i => i.value));
  const btn = document.querySelector(`[data-f="${k}"]`); if (btn) openMenu(k, btn);
});
let qt; $("#q").addEventListener("input", e => { clearTimeout(qt); qt = setTimeout(() => { S.q = e.target.value.trim(); render(); }, 120); });
document.addEventListener("keydown", e => {
  if (e.key === "Escape") { if (!$("#menu").hidden) return closeMenu(); if (S.open) { S.open = null; render(); } }
  if ((e.key === "Enter" || e.key === " ") && e.target.matches("[tabindex][data-open],[tabindex][data-gfold],[tabindex][data-lgo]")) { e.preventDefault(); e.target.click(); return; }
  if (e.key === "/" && document.activeElement !== $("#q")) { e.preventDefault(); $("#q").focus(); }
});
window.addEventListener("hashchange", () => { const id = linkId(); if (id) { if (id !== (S.open || S.cur)) goLink(id); return; } if (location.hash.includes("=")) { readHash(); $("#q").value = S.q; render(); } });

// 시작
try { const th = localStorage.getItem("pm-theme"); if (th) document.documentElement.dataset.theme = th; } catch (e) {}
loadState(); readHash();
const startId = linkId();
if (!location.hash.includes("=")) { S.tab = "list"; S.open = null; }   // 처음 열면 목록 보기부터
$("#q").value = S.q;
$("#built").textContent = `${D.built} 기준 · 오늘 ${fmtD(TODAY)}`;
{ const dark = document.documentElement.dataset.theme === "dark" || (!document.documentElement.dataset.theme && matchMedia("(prefers-color-scheme: dark)").matches); $("#theme").innerHTML = ic(dark ? "sun" : "moon"); }
render();
if (startId) goLink(startId);
</script>
</body>
</html>
